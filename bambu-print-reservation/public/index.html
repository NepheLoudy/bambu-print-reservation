<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖨️ 拓竹打印预约</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1c2733; --muted: #6b7a8c;
    --line: #e3e8ee; --accent: #0e7cc2; --ok: #1d9e74; --warn: #d9822b; --bad: #d64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; }
  .userbox { font-size: 13px; text-align: right; }
  .userbox .role { display: inline-block; padding: 1px 8px; border-radius: 9px; color: #fff; font-size: 11px; margin: 0 4px; }
  .r-admin { background: #7a3fd1; } .r-reviewer { background: var(--accent); } .r-member { background: #98a4b0; }
  .userbox button { padding: 3px 10px; font-size: 12px; background: #eef2f6; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=password], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; background: #fbfcfe;
  }
  input[type=file] { font-size: 13px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 8px; border: 1px solid var(--line); background: #fbfcfe; color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .group { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .group > .gtitle { font-size: 13px; font-weight: 600; margin-bottom: 4px; cursor: help; }
  .group > .gdesc { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line);
         border-radius: 14px; cursor: pointer; user-select: none; background: #fbfcfe; }
  .opt:hover { border-color: var(--accent); }
  .opt.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt input { display: none; }
  .hint { font-size: 12px; margin-top: 6px; min-height: 16px; }
  .hint.warn { color: var(--warn); } .hint.bad { color: var(--bad); }
  button.primary { padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; background: var(--accent); color: #fff; }
  button.ok { background: var(--ok); color: #fff; border: none; border-radius: 5px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.bad { background: var(--bad); color: #fff; border: none; border-radius: 5px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.mini { background: #eef2f6; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #fff; }
  .s-待审批 { background: var(--warn); } .s-已通过 { background: var(--accent); }
  .s-排队中 { background: #5b6ee1; } .s-打印中 { background: #d95f2b; animation: pulse 2s ease-in-out infinite; }
  .s-已完成 { background: var(--ok); } .s-已驳回, .s-已取消 { background: #98a4b0; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 95, 43, .45); } 50% { box-shadow: 0 0 0 5px rgba(217, 95, 43, 0); } }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #f3f7fb; }
  button { transition: filter .12s, transform .05s; }
  button:not(:disabled):hover { filter: brightness(1.06); }
  button:not(:disabled):active { transform: translateY(1px); }
  .histToggle, .paramToggle { color: var(--accent); cursor: pointer; font-size: 12px; user-select: none; }
  .histToggle:hover, .paramToggle:hover { text-decoration: underline; }
  /* taxonomy 组折叠：组标题可点，折叠时藏除标题外全部内容 */
  .group > .gtitle::after { content: '▾'; float: right; color: var(--muted); font-size: 11px; transition: transform .15s; }
  .group.collapsed > .gtitle::after { content: '▸'; }
  .group.collapsed > :not(.gtitle) { display: none; }
  .group > .gtitle { user-select: none; }
  /* 已选工况摘要 chips */
  .selSummary { margin-top: 10px; display: none; align-items: center; flex-wrap: wrap; gap: 6px; }
  .selSummary .sumChip { display: inline-block; background: #e8f2fa; border: 1px solid #c8e0f2; color: #14608f; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .selSummary .sumClear { color: var(--bad); cursor: pointer; font-size: 12px; user-select: none; }
  .selSummary .sumClear:hover { text-decoration: underline; }
  /* 打印机失联标注 */
  .staleTag { display: inline-block; background: #98a4b0; color: #fff; border-radius: 9px; font-size: 11px; padding: 1px 7px; margin-left: 5px; }
  .queueLine { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.7; }
  .queueLine b { color: var(--ink); }
  /* 移动端：表格卡片化 + 触控目标放大 */
  @media (max-width: 720px) {
    body { padding: 10px; }
    .opt { padding: 9px 13px; font-size: 14px; }
    button.mini { padding: 7px 12px; font-size: 13px; }
    .card { padding: 12px; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tbody tr { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--card); }
    td { border-bottom: none; padding: 3px 0; }
    td::before { content: attr(data-label); display: inline-block; min-width: 62px; color: var(--muted); font-size: 11px; }
    td:last-child::before { content: none; }
    .pcard { min-width: 100%; }
  }
  .pbar { height: 6px; background: #eef2f6; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .pbar > div { height: 100%; background: var(--accent); }
  .printer-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .pcard { flex: 1; min-width: 260px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .pcard .st { float: right; }
  .detail { font-size: 12px; color: var(--muted); }
  .detail b { color: var(--ink); }
  .revbox { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2b3947; color: #fff;
           padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; max-width: 80vw; z-index: 10; }
  .empty { color: var(--muted); font-size: 13px; padding: 16px 0; text-align: center; }
  .convention { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .scaleRow { display: flex; align-items: center; gap: 10px; padding: 6px 2px; }
  .scaleRow input[type=range] { flex: 1; accent-color: var(--accent); }
  .scaleVal { min-width: 22px; text-align: center; font-weight: 700; color: var(--accent); }
  .scaleHint { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .typedesc { font-size: 11px; color: var(--accent); margin-top: 2px; min-height: 13px; }
  .warnbar { background: #fdf3e7; border: 1px solid #f0d9b8; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #8a5a1f; margin-bottom: 10px; }
  .warnbar button { margin-left: 6px; }
  select.roleSel { width: auto; padding: 3px 6px; font-size: 12px; }
  .preview { margin-top: 12px; padding: 10px 12px; background: #f0f7fc; border: 1px solid #cfe6f5; border-radius: 8px; font-size: 12px; }
  .preview b { color: var(--accent); }
  .preview .pv { display: inline-block; margin: 2px 10px 2px 0; }
  textarea.paramEdit { width: 100%; height: 110px; font-family: Consolas, monospace; font-size: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .sugbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 12px; }
  .sugbox .cnt { display: inline-block; background: var(--warn); color: #fff; border-radius: 9px; padding: 0 8px; font-size: 11px; margin-left: 6px; }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 18px; max-width: 560px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>🖨️ 拓竹打印预约</h1>
      <div class="sub">上传模型 → 勾选工况需求 → 规则引擎定参数 → 审批 → 自动分发打印</div>
    </div>
    <div class="userbox" id="userbox"></div>
  </div>

  <div class="card" id="authCard" style="display:none">
    <h2>🔐 账号</h2>
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="switchAuth('login')">登录</button>
      <button id="tabRegister" onclick="switchAuth('register')">注册（首位注册者自动成为管理员）</button>
    </div>
    <div class="row">
      <div><label>用户名（3–32 位字母/数字/下划线）</label><input type="text" id="authUsername"></div>
      <div><label>显示姓名（审批卡/队列里显示）</label><input type="text" id="authDisplayName" style="display:none"></div>
      <div><label>密码（≥6 位）</label><input type="password" id="authPassword"></div>
      <div style="flex:0; align-self:flex-end"><button class="primary" onclick="doAuth()">确定</button></div>
    </div>
    <div class="hint" id="authHint"></div>
  </div>

  <div id="appBody" style="display:none">
    <div class="card">
      <h2>🖨️ 打印机 <span class="sub" style="display:inline">(每 15s 刷新)</span></h2>
      <div id="printerList"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <h2>📝 提交预约</h2>
      <div class="row">
        <div><label>材料类型（可空——留空则按需求标签自动反推可用材料）</label><input type="text" id="materialType" list="materialList" placeholder="如 PLA / PETG / PLA-CF，不知道就留空" oninput="preflight(); schedulePreview()"><datalist id="materialList">
          <option>PLA</option><option>PLA-CF</option><option>PLA-Aero</option><option>PETG</option><option>PETG-CF</option><option>ABS</option><option>ASA</option><option>PA</option><option>PA-CF</option><option>PC</option><option>TPU</option><option>PVA</option>
        </datalist></div>
        <div><label>颜色（多色件用 + 列全，如 白色+黑色，需勾选「多色打印」）</label><input type="text" id="color" list="colorList" placeholder="点选或输入，如 黑色 或 白色+黑色" oninput="colorHintCheck()"><datalist id="colorList"></datalist><div class="hint" id="colorHint"></div></div>
        <div><label>份数</label><input type="number" id="quantity" value="1" min="1" max="99"></div>
        <div><label>指定打印机（可空，默认自动匹配）</label><input type="text" id="assignedPrinter" list="printerNameList" placeholder="如 X1C-01，留空自动"><datalist id="printerNameList"></datalist></div>
      </div>
      <div class="row">
        <div><label>模型 / 切片文件 *（.stl/.step 走需求链路：勾选工况自动定档；.3mf 走审批直通：切片参数已内嵌）</label><input type="file" id="file" accept=".stl,.step,.stp,.3mf,.obj"></div>
      </div>
      <div class="preview" id="slicedNotice" style="display:none">📦 <b>3mf 审批直通模式</b>——切片参数与 AMS 颜色映射已内嵌文件，无需工况勾选；材料/颜色栏仅用于选机匹配</div>
      <div id="taxonomy"></div>
      <div class="hint" id="conflictHint"></div>
      <div class="convention" id="convention"></div>
      <div class="preview" id="paramPreview" style="display:none"></div>
      <div class="selSummary" id="selSummary"></div>
      <div class="actions">
        <button class="primary" id="submitBtn" onclick="submitReservation()">提交预约</button>
        <span class="hint" id="submitHint"></span>
      </div>
    </div>

    <div class="card" id="reviewCard" style="display:none">
      <h2>🎓 学习链路 <span class="sub" style="display:inline">(审批人)——建议待审池 / 专家作品导入</span></h2>
      <div class="row" style="margin-bottom:8px">
        <div style="flex:2">
          <label>导入专家手工切片 3mf（提取参数 → 与当前勾选组合生成候选规则，经待审池确认后生效）</label>
          <input type="file" id="expert3mf" accept=".3mf">
        </div>
        <div style="flex:0; align-self:flex-end"><button class="mini" onclick="importExpert3mf()">提取并生成候选</button></div>
      </div>
      <div class="hint" id="extractHint"></div>
      <div id="sugList"></div>
    </div>

    <div class="card" id="adminCard" style="display:none">
      <h2>👤 用户与角色（管理员）</h2>
      <div id="userList"></div>
    </div>

    <div class="card">
      <h2>📋 预约记录 <span class="sub" style="display:inline">(每 15s 自动刷新)</span>
        <label style="display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:12px;color:var(--muted)">
          <input type="checkbox" id="onlyPending" onchange="loadList()" style="width:auto">只看待审批</label>
      </h2>
      <div id="givenUpBar"></div>
      <div id="queueBar"></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
let TAXONOMY = null;
let ME = null;
let authMode = 'login';
let COLORS = [];         // 颜色字典（/api/print/colors，datalist + 未识别提示）
let PRINTER_NAMES = [];  // 已登记打印机名（/api/printers，指定打印机 datalist 与 givenUp 恢复下拉）
const $ = (id) => document.getElementById(id);

/** HTML 转义：displayName/文件名/理由等用户可控字段一律过这里再进 innerHTML（防存储型 XSS） */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 4000); }
const isReviewer = () => ME && ['reviewer', 'admin'].includes(ME.role);
const isAdmin = () => ME && ME.role === 'admin';

function switchAuth(mode) {
  authMode = mode;
  $('tabLogin').className = mode === 'login' ? 'on' : '';
  $('tabRegister').className = mode === 'register' ? 'on' : '';
  $('authDisplayName').style.display = mode === 'register' ? 'block' : 'none';
}

async function doAuth() {
  const username = $('authUsername').value.trim();
  const password = $('authPassword').value;
  const displayName = $('authDisplayName').value.trim();
  const url = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
  const body = authMode === 'login' ? { username, password } : { username, password, displayName };
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { $('authHint').className = 'hint bad'; $('authHint').textContent = data.error; return; }
  if (authMode === 'register') { toast('✅ 注册成功，请登录'); switchAuth('login'); return; }
  $('authHint').textContent = '';
  await loadMe();
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  ME = null;
  renderIdentity();
}

async function changePassword() {
  const oldPassword = prompt('当前密码：');
  if (!oldPassword) return;
  const newPassword = prompt('新密码（≥6 位）：');
  if (!newPassword) return;
  const res = await fetch('/api/auth/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ oldPassword, newPassword }),
  });
  const data = await res.json();
  toast(res.ok ? '✅ 密码已修改' : '❌ ' + data.error);
}

async function loadMe() {
  try {
    const res = await fetch('/api/auth/me');
    ME = res.ok ? await res.json() : null;
  } catch { ME = null; }
  renderIdentity();
}

function renderIdentity() {
  const box = $('userbox');
  if (!ME) {
    box.innerHTML = '';
    $('authCard').style.display = 'block';
    $('appBody').style.display = 'none';
    return;
  }
  $('authCard').style.display = 'none';
  $('appBody').style.display = 'block';
  box.innerHTML = `你好，<b>${esc(ME.displayName)}</b><span class="role r-${ME.role}">${ME.role}</span>
    <button onclick="changePassword()">改密码</button>
    <button onclick="logout()">退出</button>`;
  $('adminCard').style.display = isAdmin() ? 'block' : 'none';
  $('reviewCard').style.display = isReviewer() ? 'block' : 'none';
  loadUsers();
  if (isReviewer()) loadSuggestions();
}

// ---------- 学习链路 ----------

const PARAM_LABELS = { layerHeight: '层高', wallLoops: '墙数', topShellLayers: '顶面层', bottomShellLayers: '底面层', infillDensity: '填充%', infillPattern: '填充图案', speedProfile: '速度档', supportType: '支撑', supportThresholdAngle: '支撑阈值°', supportDensity: '支撑密度%', seamPosition: '接缝', directionStrategy: '朝向策略', ironing: '熨烫', brim: '裙边', brimWidth: '裙边mm', xyHoleComp: '孔补偿', xyContourComp: '轮廓补偿', temperatureDelta: '热床Δ°', nozzleTempDelta: '喷嘴Δ°' };

/** 参数实时预览：提交前看到「本单会怎么切」（使用效率核心） */
let previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(applyPreview, 250);
}
async function applyPreview() {
  if (isSlicedFile()) return; // 3mf 直通:不定档不预览
  const material = $('materialType').value.trim();
  const sel = collectSelection();
  if (!material && Object.keys(sel).length === 0) { $('paramPreview').style.display = 'none'; return; }
  try {
    const res = await fetch('/api/print/process-rules/preview', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ selection: sel, material }),
    });
    const data = await res.json();
    if (data.blocked) {
      $('paramPreview').style.display = 'block';
      $('paramPreview').innerHTML = `<b>⛔ 该勾选组合存在硬冲突，无法定档</b>（提交会被打回）`;
      return;
    }
    const p = data.params;
    const items = ['layerHeight', 'wallLoops', 'topShellLayers', 'bottomShellLayers', 'infillDensity', 'infillPattern', 'speedProfile', 'supportType', 'supportThresholdAngle', 'supportDensity', 'seamPosition']
      .map((k) => p[k] !== undefined && `<span class="pv">${PARAM_LABELS[k]}=<b>${p[k]}</b></span>`).filter(Boolean).join('');
    const mat = data.materialVerdict ? `<span class="pv">材料裁定=<b>${data.materialVerdict.excluded ? '⛔排除' : data.materialVerdict.preferred ? '✅优先' : '—'}</b></span>`
      : (p.materialExclude?.length || p.materialPrefer?.length)
        ? `<span class="pv">材料反推=<b>${p.materialExclude?.length ? '排除 ' + p.materialExclude.join('/') + ' ' : ''}${p.materialPrefer?.length ? '优先 ' + p.materialPrefer.join('/') : ''}</b>（分发时按 AMS 实装自动选）</span>` : '';
    $('paramPreview').style.display = 'block';
    $('paramPreview').innerHTML = `<b>⚙️ 本单参数预览</b>（命中 ${data.applied.length} 条规则）<br>${items}${mat}`;
  } catch { /* 预览失败不打扰提交 */ }
}

/** 修正建议：审批人看到参数不合适时，从该单发起（自动带标签组合与单号）。
 *  单据从缓存取（window.__records）——onclick 属性里内联 JSON 会因双引号截断，禁止 */
function openCorrection(id) {
  const record = (window.__records || []).find((r) => r.id === id);
  if (!record) return toast('记录已过期，刷新后重试');
  const processParams = record.processParams || {};
  const dlg = document.createElement('dialog');
  const editable = {};
  for (const k of ['layerHeight', 'wallLoops', 'topShellLayers', 'bottomShellLayers', 'infillDensity', 'infillPattern', 'speedProfile', 'supportType', 'supportThresholdAngle', 'supportDensity', 'seamPosition', 'ironing', 'brim', 'brimWidth', 'temperatureDelta', 'nozzleTempDelta']) {
    if (processParams && k in processParams) editable[k] = processParams[k];
  }
  dlg.innerHTML = `<h3 style="font-size:14px;margin-bottom:8px">📝 修正建议（${id}）</h3>
    <div class="detail" style="margin-bottom:6px">编辑参数后提交——生成候选规则进待审池（自动携带本单勾选组合），审核通过后生效</div>
    <textarea class="paramEdit" id="corrEdit">${JSON.stringify(editable, null, 1)}</textarea>
    <div style="margin-top:8px"><label>修正理由（必填，将随规则可审计）</label><input type="text" id="corrReason" placeholder="如：这个件壁太薄 2 墙不够"></div>
    <div class="actions" style="margin-top:10px">
      <button class="ok" onclick="submitCorrection('${id}', this.closest('dialog'))">提交建议</button>
      <button class="mini" onclick="this.closest('dialog').close()">取消</button>
    </div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
}

async function submitCorrection(id, dlg) {
  let set;

  const reason = dlg.querySelector('#corrReason').value.trim();

  const res = await fetch('/api/print/rule-suggestions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },

  });
  const data = await res.json();

  toast(data.merged ? `✅ 已合并到既有建议（累计 ${data.suggestion.count} 次）` : '✅ 建议已入待审池');

/** 勾选记忆：上次的选择自动恢复，只改不同的（高频提交效率） */
function saveSelMemory() {
  try { localStorage.setItem('bambu-sel-memory', JSON.stringify(collectSelection())); } catch { /* 隐私模式忽略 */ }
}
function restoreSelMemory() {
  try {
    const saved = JSON.parse(localStorage.getItem('bambu-sel-memory') || 'null');
    if (!saved) return;
    document.querySelectorAll('.opt input').forEach(inp => {
      const label = inp.closest('.opt');
      const f = label.dataset.field, o = label.dataset.opt, t = label.dataset.type;
      const want = t === 'bool' ? saved[f] === true : t === 'multi' ? (saved[f] || []).includes(o) : saved[f] === o;
      inp.checked = want;
      label.classList.toggle('on', want);
    });
    document.querySelectorAll('input[type=range][data-field]').forEach(r => {
      const v = saved[r.dataset.field];
      r.value = typeof v === 'number' ? v : 0;
      document.getElementById('scaleVal_' + r.dataset.field).textContent = r.value;
    });
    renderSelSummary(); // 恢复的勾选同步到已选摘要
  } catch { /* 忽略 */ }
}

async function loadTaxonomy() {

        return `<div><div class="gtitle" title="${(f.tooltip || '').replace(/"/g, '&quot;')}">${f.title}</div>
          <div class="scaleRow" data-scale="${f.id}">
            <span class="scaleHint">${f.minLabel || f.min}</span>
            <input type="range" min="${f.min}" max="${f.max}" step="1" value="0" data-field="${f.id}">
            <span class="scaleHint">${f.maxLabel || f.max}</span>

           <input type="checkbox" value="${o.id}">${o.label}</label>`).join('');

/** fieldId → 中文名、选项 id → 中文 label（从已加载的 TAXONOMY 反查） */
function selectionLabels() {
  const map = {};
  for (const g of (TAXONOMY?.groups || [])) {
    for (const f of g.fields) {
      map[f.id] = { title: f.title, type: f.type, labels: {} };
      for (const o of (f.options || [])) map[f.id].labels[o.id] = o.label;
    }
  }
  return map;
}

/** 已选 N 项 chips 摘要 + 一键清空——勾多了之后一眼看全自己选了什么 */
function renderSelSummary() {
  const box = $('selSummary');
  const sel = collectSelection();
  const items = [];
  const dict = selectionLabels();
  for (const [fieldId, v] of Object.entries(sel)) {
    const f = dict[fieldId];
    if (!f) continue;
    let text;
    if (f.type === 'bool') text = ''; // 布尔字段标题即语义，不追加「true」
    else if (f.type === 'multi' && Array.isArray(v)) text = v.map(x => f.labels[x] || x).join('/');
    else if (f.type === 'scale') text = (v > 0 ? '+' : '') + v;
    else text = f.labels[v] || v;
    items.push(`<span class="sumChip">${esc(f.title)}${text ? '：' + esc(text) : ''}</span>`);
  }
  if (!items.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'flex';
  box.innerHTML = `<span class="detail">已选 ${items.length} 项：</span>${items.join('')}<span class="sumClear" onclick="clearSelection()">✕ 清空全部</span>`;
}

/** 一键清空全部勾选（恢复「默认不勾」常规件状态） */
function clearSelection() {
  document.querySelectorAll('.opt input').forEach(inp => { inp.checked = false; inp.closest('.opt').classList.remove('on'); });
  document.querySelectorAll('input[type=range][data-field]').forEach(r => { r.value = 0; const sv = document.getElementById('scaleVal_' + r.dataset.field); if (sv) sv.textContent = '0'; });
  const ltd = document.getElementById('loadTypeDesc'); if (ltd) ltd.textContent = '';
  preflight(); schedulePreview(); saveSelMemory(); renderSelSummary();
}

/** 双通道模式感知（2026-10-05 曼波定）：3mf=审批直通（隐藏勾选区），stl/step=需求链路 */
function isSlicedFile() {
  const f = $('file').files[0];
  return !!f && /\.3mf$/i.test(f.name);
}
function updateSlicedMode() {
  const sliced = isSlicedFile();
  $('taxonomy').style.display = sliced ? 'none' : 'block';
  $('slicedNotice').style.display = sliced ? 'block' : 'none';
  if (sliced) { $('paramPreview').style.display = 'none'; $('conflictHint').textContent = ''; }
  else preflight();
}

function collectSelection() {
  const sel = {};
  document.querySelectorAll('.opt.on').forEach(l => {
    const f = l.dataset.field, o = l.dataset.opt, t = l.dataset.type;
    if (t === 'bool') sel[f] = true;
    else if (t === 'multi') (sel[f] = sel[f] || []).push(o);
    else if (t === 'single') sel[f] = o;
  });
  // 标尺：非 0 才收集（0=常规不偏重，等价默认不勾）
  document.querySelectorAll('input[type=range][data-field]').forEach(r => {
    const v = Number(r.value);
    if (v !== 0) sel[r.dataset.field] = v;
  });
  return sel;
}

/** 颜色栏知情提示（2026-10-08）：字典外且非 hex 的色名，选机时按「任意颜色」放行——
 *  当场提示避免「明明选了色却匹配到别的颜色的机器」的静默降级 */
function colorHintCheck() {
  const hint = $('colorHint');
  if (isSlicedFile()) { hint.textContent = ''; return; }
  const raw = $('color').value.trim();
  if (!raw) { hint.textContent = ''; return; }
  const bad = raw.split(/[+＋/、,，]/).map(s => s.trim())
    .filter(c => c && !COLORS.includes(c) && !/^#?[0-9a-f]{6}$/i.test(c));
  hint.className = 'hint ' + (bad.length ? 'warn' : '');
  hint.textContent = bad.length ? `⚠️ 「${bad.join('」「')}」不在常用色表（也非 hex），匹配时将按任意颜色处理——建议用标准色名或 #RRGGBB` : '';
}

async function loadColors() {
  try {
    const res = await fetch('/api/print/colors');
    if (!res.ok) return;
    const data = await res.json();
    COLORS = data.colorNames || [];
    $('colorList').innerHTML = COLORS.map(c => `<option value="${esc(c)}">`).join('');
    colorHintCheck();
  } catch { /* 字典拉不到则不做前置提示，后端警告兜底 */ }
}

function preflight() {
  const hint = $('conflictHint');
  if (isSlicedFile()) { hint.textContent = ''; $('submitBtn').disabled = false; return []; } // 3mf 直通:无标签冲突
  const material = $('materialType').value.trim();
  const sel = collectSelection();
  const hits = [];
  for (const c of (TAXONOMY?.conflicts || [])) {
    if (c.level !== 'block') continue;
    const whenOk = Object.entries(c.when).every(([f, cond]) => {
      const v = sel[f];
      if (cond && typeof cond === 'object' && !Array.isArray(cond)) {
        const n = Number(v);
        if (!Number.isFinite(n)) return false;
        if (cond.min !== undefined && n < cond.min) return false;
        if (cond.max !== undefined && n > cond.max) return false;
        return true;
      }
      return Array.isArray(v) ? v.some(x => cond.includes(x)) : cond.includes(v);
    });
    if (!whenOk) continue;
    if (c.materialMatch && (!material || !(new RegExp(c.materialMatch, 'i')).test(material))) continue;
    hits.push(c.message);
  }
  hint.className = 'hint ' + (hits.length ? 'bad' : '');
  hint.textContent = hits.join('；');
  $('submitBtn').disabled = hits.length > 0;
  return hits;
}

function submitReservation() {
  const file = $('file').files[0];
  if (!file) return toast('请选择模型/切片文件');
  if (preflight().length) return toast('存在硬冲突，请先调整勾选');

  const fd = new FormData();
  fd.append('file', file);
  fd.append('materialType', $('materialType').value.trim());
  fd.append('color', $('color').value.trim());
  fd.append('assignedPrinter', $('assignedPrinter').value.trim());
  fd.append('quantity', $('quantity').value || 1);
  // 3mf 直通不提交勾选（切片参数内嵌）；需求链路提交标签
  fd.append('selection', JSON.stringify(isSlicedFile() ? {} : collectSelection()));

  const btn = $('submitBtn'); btn.disabled = true; $('submitHint').textContent = '上传中 0%';
  // XHR 而非 fetch：大文件（≤200MB）需要 upload.onprogress 进度条
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/reservations');
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) $('submitHint').textContent = `上传中 ${Math.round((e.loaded / e.total) * 100)}%`;
  };
  xhr.onload = () => {
    btn.disabled = false;
    try {
      const data = JSON.parse(xhr.responseText || '{}');
      if (xhr.status === 401) { ME = null; renderIdentity(); $('submitHint').textContent = ''; return toast('登录已过期，请重新登录'); }
      if (xhr.status < 200 || xhr.status >= 300) {
        $('submitHint').textContent = '';
        return toast('❌ ' + (data.details || []).concat([data.error]).filter(Boolean).join('；'));
      }
      toast(`✅ 已提交 ${data.id}，等待审批`);
      $('file').value = ''; $('submitHint').textContent = '';
      updateSlicedMode();
      saveSelMemory();
      loadList();
    } catch { $('submitHint').textContent = ''; toast('❌ 服务响应异常'); }
  };
  xhr.onerror = () => { btn.disabled = false; $('submitHint').textContent = ''; toast('❌ 网络错误，提交失败'); };
  xhr.send(fd);
}

async function loadList() {
  const res = await fetch('/api/reservations');
  if (res.status === 401) { ME = null; renderIdentity(); return; }
  const records = await res.json();
  window.__records = records; // openCorrection/submitCorrection 从缓存取单（避免 onclick 内联 JSON 截断）
  loadGivenUp();
  const shown = $('onlyPending')?.checked ? records.filter(r => r.status === '待审批') : records;
  const box = $('list');
  if (!Array.isArray(shown) || shown.length === 0) { box.innerHTML = `<div class="empty">${$('onlyPending')?.checked ? '暂无待审批单' : '暂无预约记录'}</div>`; return; }
  const printers = window.__printers || [];
  const rows = shown.slice().reverse().map(r => {
    const mine = ME && r.submittedBy === ME.id;
    // 参数快照折叠（2026-10-08 展示优化）：默认展示前 8 项，其余「+N 项」展开
    const paramEntries = r.processParams ? Object.entries(r.processParams)
      .filter(([k, v]) => !['materialExclude', 'materialPrefer'].includes(k) && v !== '' && v !== null && !(Array.isArray(v) && !v.length)) : [];
    const pLimit = expandedParams.has(r.id) ? paramEntries.length : Math.min(8, paramEntries.length);
    const params = paramEntries.slice(0, pLimit)
      .map(([k, v]) => `${esc(PARAM_LABELS[k] || k)}=${esc(Array.isArray(v) ? v.join('|') : v)}`).join(' · ')
      + (paramEntries.length > pLimit ? ` <span class="paramToggle" onclick="toggleParam('${r.id}')">＋${paramEntries.length - pLimit} 项</span>` : '')
      + (expandedParams.has(r.id) && paramEntries.length > 8 ? ` <span class="paramToggle" onclick="toggleParam('${r.id}')">收起</span>` : '');
    const srcTag = r.processParams ? '' : (r.embeddedParams
      ? `<b>3mf 直通</b>（内嵌: ${Object.entries(r.embeddedParams.params || {}).slice(0, 6).map(([k, v]) => esc((PARAM_LABELS[k] || k) + '=' + v)).join(' · ')}${Object.keys(r.embeddedParams.params || {}).length > 6 ? ' …' : ''}${r.estMinutes ? '｜预计 ' + fmtMins(r.estMinutes) : ''}）<br>`
      : '<b>3mf 直通</b>（切片参数内嵌）<br>');
    const rules = (r.appliedRules || []).map(x => esc(x.reason)).join('；');
    // 状态轨迹折叠（2026-10-08 展示优化）：默认最近 2 条，展开全部（跨 15s 刷新保留）
    const histAll = (r.history || []);
    const histShown = expandedHist.has(r.id) ? histAll : histAll.slice(-2);
    const hist = histShown.map(h => `${esc((h.at || '').replace('T', ' ').slice(5, 16))} ${esc(h.to)}${h.note ? '（' + esc(h.note) + '）' : ''}`).reverse().join('<br>')
      + (histAll.length > 2 ? `<br><span class="histToggle" onclick="toggleHist('${r.id}')">${expandedHist.has(r.id) ? '▲ 收起轨迹' : `▼ 展开全部 ${histAll.length} 条轨迹`}</span>` : '');
    // 打印中行内实时进度（从打印机状态 join——不用等下一轮整卡刷新）
    const livePrinter = ['打印中', '暂停'].includes(r.status) ? printers.find(p => p.name === r.printer) : null;
    const liveProg = livePrinter && livePrinter.progress
      ? `<div class="pbar"><div style="width:${Math.min(100, livePrinter.progress)}%"></div></div><span class="detail">${livePrinter.progress}%${livePrinter.remainingMinutes ? '，剩余 ' + livePrinter.remainingMinutes + ' 分钟' : ''}</span>` : '';
    const pending = r.status === '待审批';
    const unsliced = pending && !/\.3mf$/i.test(r.fileName || '');
    const reviewBtns = pending && isReviewer() ? `<div class="revbox">
          <button class="ok" ${unsliced ? 'disabled title="未切片模型:请先用 Bambu Studio 切片为 3mf 后重新提交"' : ''} onclick="review('${r.id}','approve')">通过</button>
          <button class="bad" onclick="review('${r.id}','reject')">驳回</button>
          <button class="mini" onclick="openCorrection('${r.id}')">建议修正</button>
        </div>${unsliced ? '<div class="detail" style="color:var(--warn)">⚠️ 未切片模型——切片为 3mf 后重新提交才能分发</div>' : ''}` : '';
    const cancelBtn = !['已完成', '已取消', '已驳回'].includes(r.status) && (mine || isReviewer())
      ? `<button class="mini" onclick="cancelReservation('${r.id}')">取消</button>` : '';
    // 复刻：源文件仍在保留期的终态单一键带参重提（服务端复制文件免重传）
    const reprintBtn = r.status === '已完成'
      ? `<button class="mini" onclick="reprint('${r.id}')">复刻</button>` : '';
    return `<tr>
      <td data-label="单号"><b>${esc(r.id)}</b><br><span class="detail">${esc((r.createdAt || '').replace('T', ' ').slice(0, 16))}</span></td>
      <td data-label="状态"><span class="badge s-${esc(r.status)}">${esc(r.status)}</span>${r.printer ? '<br><span class="detail">' + esc(r.printer) + '</span>' : ''}${liveProg}</td>
      <td data-label="发起人">${esc(r.applicant || '?')}${mine ? '<br><span class="detail">(我)</span>' : ''}<br><span class="detail">${esc(r.fileName || '')}</span></td>
      <td data-label="需求">${esc(r.materialType || '?')}${r.color ? '×' + esc(r.color) : ''}${r.isUrgent ? ' ⚡' : ''}${r.quantity > 1 ? ' ×' + r.quantity + '件' : ''}</td>
      <td data-label="参数与轨迹" class="detail">${srcTag}${params ? '<b>参数</b> ' + params + '<br>' : ''}${rules ? '<b>依据</b> ' + rules + '<br>' : ''}${hist}</td>
      <td data-label="操作">${reviewBtns}${cancelBtn}${reprintBtn}</td>
    </tr>`;
  }).join('');
  box.innerHTML = `<table>
    <thead><tr><th>单号</th><th>状态</th><th>发起人/文件</th><th>需求</th><th>参数与轨迹</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// 折叠状态（跨 15s 自动刷新保留；会话内有效）
const expandedHist = new Set();
const expandedParams = new Set();
function toggleHist(id) { expandedHist.has(id) ? expandedHist.delete(id) : expandedHist.add(id); loadList(); }
function toggleParam(id) { expandedParams.has(id) ? expandedParams.delete(id) : expandedParams.add(id); loadList(); }

async function review(id, action) {
  if (!isReviewer()) return toast('仅审批人可操作');
  const comment = prompt(action === 'approve' ? '审批意见（可空）' : '驳回理由：') || '';
  const res = await fetch(`/api/reservations/${id}/${action}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ comment }),
  });
  const data = await res.json();
  if (res.status === 401) { ME = null; renderIdentity(); return toast('登录已过期'); }
  if (!res.ok) return toast('❌ ' + data.error);
  toast(`✅ ${id} ${action === 'approve' ? '已通过并入队' : '已驳回'}`);
  loadList();
}

async function cancelReservation(id) {
  if (!confirm(`确认取消 ${id}？`)) return;
  const res = await fetch(`/api/reservations/${id}/cancel`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) return toast('❌ ' + data.error);
  toast(`✅ ${id} 已取消`);
  loadList();
}

/** 分钟 → 「Xh Ym」（ETA 展示） */
function fmtMins(mins) {
  const m = Number(mins);
  if (!Number.isFinite(m) || m <= 0) return '';
  return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? (m % 60) + 'm' : ''}` : `${m}m`;
}

/** 复刻：已完成单一键带参重提（服务端复制源文件，免重传；新单走完整审批流） */
async function reprint(id) {
  if (!confirm(`复刻 ${id}？将以你的名义生成新预约单（带原勾选与参数，重新审批）`)) return;
  const res = await fetch(`/api/reservations/${id}/reprint`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) return toast('❌ ' + data.error);
  toast(`✅ 已复刻为新单 ${data.id}，等待审批`);
  loadList();
}

/** 队列 ETA 条（2026-10-08）：队列按 3mf 内嵌预估求和，在打按打印机实时剩余求和；
 *  附队列前几单明细（单号/文件/加急/剩余件数），不只给一个总时长 */
function renderQueueBar(queue, printing) {
  const bar = $('queueBar');
  queue = queue || [];
  printing = printing || [];
  const known = queue.filter(t => Number(t.estMinutes) > 0);
  const sum = known.reduce((s, t) => s + Number(t.estMinutes), 0);
  const unknown = queue.length - known.length;
  const printSum = printing.reduce((s, p) => s + (Number(p.remainingMinutes) || 0), 0);
  const parts = [];
  if (queue.length) parts.push(`队列预估总时长 <b>${sum > 0 ? '~' + fmtMins(sum) : '未知'}</b>${unknown > 0 ? `（${unknown} 单无预估）` : ''}`);
  if (printing.length) parts.push(`在打 ${printing.length} 台实时剩余合计 <b>${printSum > 0 ? '~' + fmtMins(printSum) : '未知'}</b>`);
  const etaHtml = parts.length ? `<div class="detail">⏱️ ${parts.join('｜')}</div>` : '';
  const lines = queue.slice(0, 4).map(t =>
    `<b>#${esc(t.applicationNo || t.recordId || '')}</b> ${esc(t.fileName || '')}${t.isUrgent ? ' ⚡' : ''}${Number(t.remaining) > 0 ? `（还剩 ${t.remaining} 件）` : ''}`);
  const lineHtml = lines.length
    ? `<div class="queueLine">📋 ${lines.join('　·　')}${queue.length > 4 ? `　…共 ${queue.length} 单` : ''}</div>`
    : '';
  bar.innerHTML = etaHtml + lineHtml;
}

/** 队列条（全员可见）+ 重试耗尽黄条（reviewer+）：
 *  队列/ETA 对所有人渲染（loadList 每 15s 调）；黄条仅审批人，一键指定打印机恢复（下拉选机） */
async function loadGivenUp() {
  if (!$('queueBar') && !isReviewer()) return;
  const res = await fetch('/api/dispatch/queue');
  if (!res.ok) { $('givenUpBar').innerHTML = ''; return; }
  const data = await res.json();
  renderQueueBar(data.queue, data.printing); // 队列明细+ETA 条（全员）
  if (!isReviewer()) { $('givenUpBar').innerHTML = ''; return; }
  const given = data.givenUp || [];
  if (!given.length) { $('givenUpBar').innerHTML = ''; return; }
  $('givenUpBar').innerHTML = `<div class="warnbar">⚠️ <b>${given.length}</b> 单自动重试耗尽待人工恢复：` +
    given.map(g => `#${esc(g.recordId)} ${esc(g.fileName || '')}（${g.error ? '原因：' + esc(g.error) + '；' : ''}<button class="mini" onclick="recoverGivenUp('${g.recordId}')">指定打印机恢复</button>`).join('　') + `</div>`;
}

/** 指定打印机恢复：prompt 换下拉（2026-10-08）——拼错名字会被后端 400 打回，下拉直接消除拼错面 */
async function recoverGivenUp(recordId) {
  if (!PRINTER_NAMES.length) {
    try { const res = await fetch('/api/printers'); if (res.ok) PRINTER_NAMES = (await res.json()).map(p => p.name); } catch { /* 忽略 */ }
  }
  if (!PRINTER_NAMES.length) return toast('暂无已登记打印机');
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<h3 style="font-size:14px;margin-bottom:8px">恢复 #${esc(recordId)}</h3>
    <div class="detail" style="margin-bottom:6px">选择要分发到的打印机（可含需人工上传的非自动机型）：</div>
    <select id="recoverPrinterSel" style="width:100%;padding:8px">${PRINTER_NAMES.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <div class="actions" style="margin-top:10px">
      <button class="ok" onclick="doRecover('${recordId}', this.closest('dialog'))">恢复分发</button>
      <button class="mini" onclick="this.closest('dialog').close()">取消</button>
    </div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
}

async function doRecover(recordId, dlg) {
  const printerName = dlg.querySelector('#recoverPrinterSel').value;
  const res = await fetch('/api/dispatch/manual', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ recordId, printerName }),
  });
  const data = await res.json();
  if (!res.ok) return toast('❌ ' + data.error);
  dlg.close();
  toast(data.manualOnly ? `📝 ${data.message}` : `✅ ${data.message}`);
  loadList();
}

async function loadPrinters() {
  if (!ME) return;
  const res = await fetch('/api/printers');
  if (res.status === 401) return;
  const printers = await res.json();
  window.__printers = printers; // 列表行内实时进度 join 用
  PRINTER_NAMES = printers.map(p => p.name); // 指定打印机 datalist + givenUp 恢复下拉共用
  $('printerNameList').innerHTML = PRINTER_NAMES.map(n => `<option value="${esc(n)}">`).join('');
  const box = $('printerList');
  if (!Array.isArray(printers) || !printers.length) { box.innerHTML = '<div class="empty">暂无登记的打印机（.env PRINTER_HOSTS）</div>'; return; }
  const ST = { '空闲': 'var(--ok)', '打印中': '#d95f2b', '暂停': '#d9b32b', '已完成': 'var(--ok)', '故障': 'var(--bad)', '未连接': '#98a4b0', '准备中': 'var(--warn)', '切片中': 'var(--warn)' };
  box.innerHTML = `<div class="printer-grid">` + printers.map(p => {
    // 失联标注（2026-10-08 展示优化）：报文过期（幽灵空闲）时明确警示，不再误信最后的空闲态
    const staleIdle = p.stateStale && ['空闲', '已完成'].includes(p.status);
    const statusHtml = esc(p.status) + (p.stateStale ? '<span class="staleTag">失联</span>' : '');
    const color = staleIdle ? '#98a4b0' : (ST[p.status] || '#5b6ee1');
    const ams = (p.ams || []).filter(t => t.type).map(t => `${esc(t.type)}${t.colorHex ? '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + esc(t.colorHex) + ';vertical-align:middle"></span>' : ''}`).join('、') || '—';
    const job = p.activeTask ? `<div class="detail">任务 <b>${esc(p.activeTask.applicationNo || '')}</b> ${esc(p.activeTask.fileName || '')}</div>` : p.currentJob ? `<div class="detail">文件 ${esc(p.currentJob)}</div>` : '';
    const prog = (p.status === '打印中' || p.status === '暂停') && p.progress
      ? `<div class="pbar"><div style="width:${Math.min(100, p.progress)}%"></div></div><div class="detail">${p.progress}%${p.remainingMinutes ? '，剩余 ' + p.remainingMinutes + ' 分钟' : ''}</div>` : '';
    // 打印机控制（admin）：暂停/恢复/停止上页面（原仅 HTTP API），二次确认防误触
    const ctl = isAdmin() && ['打印中', '暂停'].includes(p.status)
      ? `<div style="margin-top:6px">
          ${p.status === '打印中' ? `<button class="mini" onclick="printerCtl(${p.id},'pause','暂停 ${esc(p.name)} 的打印？')">⏸ 暂停</button> ` : ''}
          ${p.status === '暂停' ? `<button class="mini" onclick="printerCtl(${p.id},'resume','恢复 ${esc(p.name)} 的打印？')">▶ 恢复</button> ` : ''}
          <button class="bad" onclick="printerCtl(${p.id},'stop','⚠️ 停止 ${esc(p.name)} 的打印？停机不可恢复，耗材作废')">⏹ 停止</button>
        </div>` : '';
    return `<div class="pcard"${staleIdle ? ' style="opacity:.75"' : ''}>
      <b>${esc(p.name)}</b> <span class="detail">${esc(p.model)}</span><span class="st badge" style="background:${color}">${statusHtml}</span>
      ${job}${prog}
      ${staleIdle ? '<div class="detail" style="color:var(--bad)">⚠️ 超过 3 分钟无状态报文——分发不可选，请检查打印机电源/网络</div>' : ''}
      <div class="detail" style="margin-top:4px">AMS: ${ams}${p.autoDispatch ? '' : '｜⚙️ 人工机型'}</div>
      ${ctl}
    </div>`;
  }).join('') + '</div>';
}

/** 打印机控制（admin）：pause/resume/stop，带确认 */
async function printerCtl(id, action, confirmText) {
  if (!confirm(confirmText)) return;
  const res = await fetch(`/api/printers/${id}/${action}`, { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  toast(res.ok ? '✅ 指令已下发' : '❌ ' + (data.error || '指令失败'));
  setTimeout(loadPrinters, 800);
}

(async function init() {
  $('list').innerHTML = '<div class="empty">加载中…</div>';
  await loadMe();
  await loadTaxonomy();
  loadColors();
  restoreSelMemory();
  $('file').addEventListener('change', updateSlicedMode); // 双通道模式感知
  preflight();
  schedulePreview();
  renderSelSummary();
  if (ME) { await loadList(); loadPrinters(); }
  setInterval(() => { if (ME) { loadList(); loadPrinters(); } }, 15000);
})();
</script>
