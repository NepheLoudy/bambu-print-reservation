<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🖨️ 打印机状态观察台</title>
<style>
  :root {
    --bg: #0e1116; --card: #171c24; --line: #262d38; --txt: #d8dee9; --dim: #8a94a6;
    --accent: #5b6ee1; --ok: #3f9d63; --warn: #d9b32b; --bad: #d9534f; --print: #d95f2b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--dim); font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .pcard .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .pcard b { font-size: 15px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
  .brandB { background: #e07b39; } .brandT { background: #5b6ee1; }
  .staleTag { background: var(--bad); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 10px; margin-left: 4px; }
  .detail { color: var(--dim); font-size: 12px; }
  .cam { position: relative; background: #0a0d11; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cam img, .cam canvas { max-width: 100%; max-height: 100%; display: block; }
  .cam .ph { color: var(--dim); font-size: 12px; text-align: center; padding: 0 16px; }
  .cam .camBtn { position: absolute; right: 8px; top: 8px; z-index: 2; }
  .pbar { height: 8px; background: #0a0d11; border-radius: 5px; overflow: hidden; margin: 6px 0 2px; }
  .pbar > div { height: 100%; background: var(--print); transition: width .5s; }
  .temps { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .temp { background: #0a0d11; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; }
  .temp b { font-size: 14px; }
  .amsGrid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tray { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 11px; min-width: 72px; background: #0a0d11; }
  .tray.active { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid #333; }
  .cmds { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #232b37; color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: #2c3644; }
  button.bad { background: #4a2321; border-color: #6e332f; }
  button.ok { background: #1e3a2a; border-color: #2d5c40; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #232b37; border: 1px solid var(--line); padding: 8px 18px; border-radius: 8px; display: none; z-index: 9; }
  .loginBox { max-width: 360px; margin: 80px auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  input { background: #0a0d11; border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 6px 10px; width: 100%; }
  .meta { color: var(--dim); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="loginBox" id="loginBox" style="display:none">
  <h2>🔐 登录观察台</h2>
  <div style="margin:8px 0"><input id="username" placeholder="用户名"></div>
  <div style="margin:8px 0"><input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="ok" style="width:100%" onclick="doLogin()">登录</button>
  <div class="detail" id="loginHint" style="margin-top:8px"></div>
</div>

<div class="wrap" id="appBody" style="display:none">
  <div class="head">
    <div>
      <h1>📺 打印机状态观察台</h1>
      <div class="sub">拓竹（MQTT 推送）+ 闪铸（HTTP 轮询）双链路 · 画面经本服务内网代理 · 每 5s 刷新　<a href="/index.html">← 返回预约页</a></div>
    </div>
    <div class="userbox" id="userbox"></div>
  </div>
  <div class="grid" id="fleet"><div class="detail">加载中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ME = null;
let IS_ADMIN = false;

// 每台拓竹机的解码器现场（camera kind=p1stream）：ws / decoder / canvas 句柄
const p1Sessions = new Map();

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

async function loadMe() {
  const res = await fetch('/api/auth/me');
  if (res.ok) { ME = await res.json(); IS_ADMIN = ['reviewer', 'admin'].includes(ME.role); return true; }
  return false;
}

async function doLogin() {
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $('loginHint').textContent = '❌ ' + (data.error || '登录失败'); return; }
  ME = data; IS_ADMIN = ['reviewer', 'admin'].includes(ME.role);
  enter();
}

function enter() {
  $('loginBox').style.display = 'none';
  $('appBody').style.display = 'block';
  $('userbox').innerHTML = `<span class="sub">${esc(ME.displayName)}（${esc(ME.role)}）</span> <button onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>location.reload())">退出</button>`;
  loadFleet();
  setInterval(loadFleet, 5000);
}

// ---------- 机队渲染 ----------

function statusBadge(p) {
  const staleIdle = p.stateStale && ['空闲', '已完成'].includes(p.status);
  const color = staleIdle ? '#98a4b0' : ({ '空闲': 'var(--ok)', '已完成': 'var(--ok)', '打印中': 'var(--print)', '暂停': 'var(--warn)', '故障': 'var(--bad)', '准备中': 'var(--warn)', '切片中': 'var(--warn)' }[p.status] || '#5b6ee1');
  return `<span class="badge" style="background:${color}">${esc(p.status)}${p.stateStale ? '<span class="staleTag">失联</span>' : ''}</span>`;
}

function trayHtml(t) {
  const sw = t.colorHex ? `<span class="swatch" style="background:#${esc(t.colorHex)}"></span>` : '';
  return `<div class="tray${t.active ? ' active' : ''}" title="${t.active ? '当前供料槽' : ''}">${sw}<b>${esc(t.slot)}</b><br>${esc(t.type || '—')}</div>`;
}

function amsSection(p) {
  const trays = p.ams || [];
  if (!trays.length) {
    // 闪铸直进料等无料站机型：显示供料形态说明而非空白
    return `<div class="amsGrid"><div class="tray">无料站信息${p.brand === 'flashforge' ? '（直进料机型）' : '（未上报/未连接）'}</div></div>`;
  }
  const label = p.brand === 'flashforge' ? '供料' : 'AMS';
  return `<div class="detail" style="margin-top:6px">${label}：</div><div class="amsGrid">${trays.map(trayHtml).join('')}</div>`;
}

function camSection(p) {
  const id = p.id;
  if (p.camera === 'mjpeg') {
    return `<div class="cam"><img src="/api/printers/${id}/camera/mjpeg?t=${Date.now()}" alt="画面"
      onerror="this.parentElement.innerHTML='<div class=ph>📷 画面不可用——机型无摄像头或打印机离线</div>'">
      <span class="detail" style="position:absolute;left:8px;bottom:6px">MJPEG · 闪铸 8080</span></div>`;
  }
  if (p.camera === 'p1stream') {
    return `<div class="cam" id="cam${id}">
      <div class="ph" id="camPh${id}">📷 拓竹本地流（TCP 6000 · H.264）——点「连接画面」经服务端中继拉流</div>
      <canvas id="camCv${id}" style="display:none" width="640" height="360"></canvas>
      <button class="camBtn" id="camBtn${id}" onclick="toggleP1Stream(${id}, this)">▶ 连接画面</button>
    </div>`;
  }
  if (p.camera === 'rtsp') {
    return `<div class="cam"><div class="ph">📷 该机型为 RTSP 画面通道（X1/H2D 系）——代理通道待接，暂不支持网页观看</div></div>`;
  }
  return '';
}

function cardHtml(p) {
  const temps = [
    p.nozzleTemp != null ? `<div class="temp">喷嘴 <b>${p.nozzleTemp}°</b>${p.nozzleTargetTemp != null ? ` <span class="detail">/${p.nozzleTargetTemp}°</span>` : ''}</div>` : '',
    p.bedTemp != null ? `<div class="temp">热床 <b>${p.bedTemp}°</b>${p.bedTargetTemp != null ? ` <span class="detail">/${p.bedTargetTemp}°</span>` : ''}</div>` : '',
    p.chamberTemp != null ? `<div class="temp">腔室 <b>${p.chamberTemp}°</b></div>` : '',
  ].join('');
  const job = p.activeTask
    ? `<div class="detail">任务 <b>${esc(p.activeTask.applicationNo || '')}</b> ${esc(p.activeTask.fileName || '')}</div>`
    : p.currentJob ? `<div class="detail">文件 ${esc(p.currentJob)}</div>` : '';
  const prog = (p.status === '打印中' || p.status === '暂停') && p.progress
    ? `<div class="pbar"><div style="width:${Math.min(100, p.progress)}%"></div></div><div class="detail">${p.progress}%${p.remainingMinutes ? ` · 剩余约 ${p.remainingMinutes} 分钟` : ''}</div>` : '';
  const cmds = IS_ADMIN
    ? `<div class="cmds">
        ${p.status === '打印中' ? `<button onclick="ctl(${p.id},'pause','暂停打印？')">⏸ 暂停</button>` : ''}
        ${p.status === '暂停' ? `<button class="ok" onclick="ctl(${p.id},'resume','恢复打印？')">▶ 恢复</button>` : ''}
        <button onclick="ctl(${p.id},'light-on','打开 ${esc(p.name)} 腔灯？')">💡 开灯</button>
        <button onclick="ctl(${p.id},'light-off','关闭腔灯？')">🔅 关灯</button>
        <button class="bad" onclick="ctl(${p.id},'stop','⚠️ 停止打印？停机不可恢复，耗材作废')">⏹ 停止</button>
      </div>`
    : '<div class="meta">控制指令仅审批人及以上可用</div>';
  return `<div class="pcard">
    <div class="top">
      <b>${esc(p.name)}</b>
      <span class="badge ${p.brand === 'flashforge' ? 'brandB' : 'brandT'}">${p.brand === 'flashforge' ? '闪铸' : '拓竹'}</span>
      <span class="detail">${esc(p.model)} · ${esc(p.host)}</span>
      ${statusBadge(p)}
      ${p.autoDispatch ? '' : '<span class="detail">⚙️ 人工机型</span>'}
    </div>
    ${camSection(p)}
    ${job}${prog}
    <div class="temps">${temps || '<span class="detail">温度未上报</span>'}</div>
    ${amsSection(p)}
    ${p.stateStale ? '<div class="meta" style="color:var(--bad)">⚠️ 超过 3 分钟无状态报文——显示的是过期快照</div>' : ''}
    ${cmds}
  </div>`;
}

async function loadFleet() {
  const res = await fetch('/api/printers');
  if (res.status === 401) { location.reload(); return; }
  const printers = await res.json();
  if (!Array.isArray(printers) || !printers.length) { $('fleet').innerHTML = '<div class="detail">暂无登记打印机（.env PRINTER_HOSTS）</div>'; return; }
  $('fleet').innerHTML = printers.map(cardHtml).join('');
  // p1stream 会话保持：卡片重渲染会重画 DOM，正在观看的流重连
  for (const [id, ses] of p1Sessions) {
    const alive = printers.find((p) => p.id === id && p.camera === 'p1stream');
    if (!alive) { closeP1Stream(id); continue; }
    if (ses.wantWatch) { p1Sessions.delete(id); startP1Stream(id, true); }
  }
}

// ---------- 指令 ----------

async function ctl(id, action, confirmText) {
  if (!confirm(confirmText)) return;
  const endpoint = action === 'light-on' ? 'light' : action === 'light-off' ? 'light' : action;
  const opts = action.startsWith('light') ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on: action === 'light-on' }) } : { method: 'POST' };
  const res = await fetch(`/api/printers/${id}/${endpoint}`, opts);
  const data = await res.json().catch(() => ({}));
  toast(res.ok ? '✅ 指令已下发' : '❌ ' + (data.error || '指令失败'));
  setTimeout(loadFleet, 800);
}

// ---------- 拓竹 P1 系画面：WS 中继 + WebCodecs H.264 解码 ----------

/** 从 Annex-B 字节流拆 NALU（start code 00 00 01 前缀），返回 [NALU...] */
function splitAnnexB(buf) {
  const u8 = new Uint8Array(buf);
  const nals = [];
  let start = -1;
  for (let i = 0; i + 2 < u8.length; i++) {
    if (u8[i] === 0 && u8[i + 1] === 0 && u8[i + 2] === 1) {
      if (start >= 0) nals.push(u8.subarray(start, i - (u8[i - 1] === 0 ? 1 : 0)));
      start = i + 3;
    }
  }
  if (start >= 0 && start < u8.length) nals.push(u8.subarray(start));
  return nals;
}

function nalType(nal) { return nal[0] & 0x1f; }

/** SPS → avc codec 串（profile_idc.constraint_flags.level_idc） */
function codecFromSps(sps) {
  const hex = (n) => n.toString(16).padStart(2, '0');
  return `avc1.${hex(sps[1])}${hex(sps[2])}${hex(sps[3])}`;
}

async function startP1Stream(id, auto = false) {
  const ph = $(`camPh${id}`), btn = $(`camBtn${id}`), cv = $(`camCv${id}`);
  if (!ph) return;
  const ses = { wantWatch: true, ws: null, decoder: null, pending: [], sps: null, pps: null, keySeen: false, ts: 0, frameCount: 0 };
  p1Sessions.set(id, ses);
  btn.textContent = '⏹ 断开';
  btn.onclick = () => closeP1Stream(id);
  ph.textContent = '🔄 连接中继…';

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  try {
    ws = new WebSocket(`${proto}://${location.host}/api/printers/${id}/camera/h264`);
  } catch (err) {
    ph.textContent = '❌ 中继连接失败：' + err.message;
    return;
  }
  ses.ws = ws;
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => { ph.textContent = '📡 已连接中继，等待打印机推流…（若长期无数据：检查打印机 6000 端口/LAN 模式）'; };
  ws.onerror = () => { ph.textContent = '❌ 中继连接失败（登录态失效或打印机不可达）'; };
  ws.onclose = () => {
    if (p1Sessions.get(id) === ses) {
      ph.textContent = '⏹ 画面已断开';
      try { ses.decoder && ses.decoder.close(); } catch { /* 已关 */ }
      p1Sessions.delete(id);
      const b = $(`camBtn${id}`);
      if (b) { b.textContent = '▶ 连接画面'; b.onclick = () => startP1Stream(id); }
    }
  };

  // WebCodecs 能力检查（老浏览器降级提示）
  if (!('VideoDecoder' in window)) {
    ph.textContent = '⚠️ 此浏览器不支持 WebCodecs，无法解 H.264 裸流（建议 Chrome/Edge 94+）';
    ws.close();
    return;
  }

  ses.decoder = new VideoDecoder({
    output: (frame) => {
      ses.frameCount++;
      cv.style.display = 'block';
      ph.style.display = 'none';
      // 首帧起按实际分辨率校准画布
      if (cv.width !== frame.displayWidth || cv.height !== frame.displayHeight) {
        cv.width = frame.displayWidth; cv.height = frame.displayHeight;
      }
      cv.getContext('2d').drawImage(frame, 0, 0);
      frame.close();
      if (ses.frameCount === 1) toast(`✅ ${id} 号机画面已接通`);
    },
    error: (e) => { console.error('decoder', e); ph.textContent = '❌ 解码失败：' + e.message; },
  });

  ws.onmessage = (ev) => {
    if (!(ev.data instanceof ArrayBuffer)) return;
    ses.pending.push(new Uint8Array(ev.data));
    // 攒一攒再拆帧（打印机 TCP 分包不按 NALU 对齐）
    if (ses.pending.length < 4 && ses.pending.reduce((a, b) => a + b.length, 0) < 65536) return;
    const total = ses.pending.reduce((a, b) => a + b.length, 0);
    const merged = new Uint8Array(total);
    let off = 0;
    for (const piece of ses.pending) { merged.set(piece, off); off += piece.length; }
    ses.pending = [];

    for (const nal of splitAnnexB(merged.buffer)) {
      const t = nalType(nal);
      if (t === 7) { ses.sps = nal; continue; }   // SPS
      if (t === 8) { ses.pps = nal; continue; }   // PPS
      const isIdr = t === 5;
      if (!isIdr && t !== 1) continue;            // SEI/其他丢弃
      if (isIdr && !ses.keySeen) {
        if (!ses.sps || !ses.pps) continue;       // 等 SPS/PPS 齐了再配解码器
        try {
          ses.decoder.configure({ codec: codecFromSps(spsToBytes(ses.sps)), optimizeForLatency: true });
        } catch (err) {
          ph.textContent = '❌ 解码器配置失败：' + err.message;
          ws.close();
          return;
        }
        ses.keySeen = true;
      }
      if (!ses.keySeen || ses.decoder.state !== 'configured') continue;
      // Annex-B → decoder：key 帧前缀 SPS/PPS，保证随机接入
      const chunks = isIdr ? [ses.sps, ses.pps, nal] : [nal];
      const len = chunks.reduce((a, b) => a + b.length + 4, 0);
      const data = new Uint8Array(len);
      let o = 0;
      for (const c of chunks) {
        data[o++] = 0; data[o++] = 0; data[o++] = 0; data[o++] = 1;
        data.set(c, o); o += c.length;
      }
      try {
        ses.decoder.decode(new EncodedVideoChunk({
          type: isIdr ? 'key' : 'delta',
          timestamp: (ses.ts += 40) * 1000,
          data,
        }));
      } catch { /* 坏帧丢弃 */ }
    }
  };
}

/** NALU 去头（start code 已被 splitAnnexB 剥掉，直接取 body） */
function spsToBytes(sps) { return sps; }

function closeP1Stream(id) {
  const ses = p1Sessions.get(id);
  if (!ses) return;
  ses.wantWatch = false;
  try { ses.ws && ses.ws.close(); } catch { /* 已关 */ }
  try { ses.decoder && ses.decoder.close(); } catch { /* 已关 */ }
  p1Sessions.delete(id);
  const b = $(`camBtn${id}`), ph = $(`camPh${id}`), cv = $(`camCv${id}`);
  if (b) { b.textContent = '▶ 连接画面'; b.onclick = () => startP1Stream(id); }
  if (ph) { ph.style.display = ''; ph.textContent = '📷 拓竹本地流（TCP 6000 · H.264）——点「连接画面」经服务端中继拉流'; }
  if (cv) cv.style.display = 'none';
}

// ---------- 启动 ----------
(async function init() {
  if (await loadMe()) enter();
  else $('loginBox').style.display = 'block';
})();
</script>
</body>
</html>
