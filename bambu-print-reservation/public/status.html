<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千里战队3D打印预约中心 · 设备观察台</title>
<style>
  :root {
    --bg: #0a0d12; --card: #10141b; --line: #212a36; --line2: #2c3745; --txt: #e8edf4; --dim: #7e8a99;
    --inset: #0c1016; --amber: #ffb02e; --hot: #ff6a2b; --cyan: #53d6f0;
    --accent: var(--amber); --ok: #35d07f; --warn: #ffb02e; --bad: #ff5d5d; --print: #ff6a2b;
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; min-height: 100vh;
    background-image:
      radial-gradient(1200px 500px at 20% -10%, rgba(255, 138, 31, .07), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(120, 150, 190, .04) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(120, 150, 190, .04) 31px 32px);
    background-attachment: fixed; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin: 0 0 0; padding: 22px 4px 14px; flex-wrap: wrap; gap: 8px; position: relative; }
  .head::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: repeating-linear-gradient(-45deg, var(--amber) 0 12px, #131920 12px 24px); opacity: .85; border-radius: 2px; }
  .brandbar { display: flex; align-items: center; gap: 14px; }
  .brandmark { width: 46px; height: 46px; flex: 0 0 46px; background: linear-gradient(135deg, var(--amber), var(--hot));
    clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%); display: flex; align-items: center; justify-content: center;
    font: 800 20px/1 var(--mono); color: #14100a; letter-spacing: -1px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: 2px; }
  h1 .en { display: block; font: 600 10px/1.4 var(--mono); letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  .sub { color: var(--dim); font-size: 12px; }
  a { color: var(--cyan); text-decoration: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
  .pcard .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .pcard b { font-size: 15px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; color: #fff; }
  .brandB { background: #e07b39; } .brandT { background: var(--amber); color: #14100a; }
  .staleTag { background: var(--bad); color: #fff; border-radius: 4px; padding: 0 6px; font-size: 10px; margin-left: 4px; }
  .detail { color: var(--dim); font-size: 12px; }
  .cam { position: relative; background: var(--inset); border: 1px solid var(--line); border-radius: 4px; margin: 8px 0; height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cam img, .cam canvas { max-width: 100%; max-height: 100%; display: block; }
  .cam .ph { color: var(--dim); font-size: 12px; text-align: center; padding: 0 16px; }
  .cam .camBtn { position: absolute; right: 8px; top: 8px; z-index: 2; }
  .cam .camTag { position: absolute; left: 8px; bottom: 6px; font-size: 10px; color: var(--dim); }
  .pbar { height: 8px; background: var(--inset); border-radius: 5px; overflow: hidden; margin: 6px 0 2px; }
  .pbar > div { height: 100%; background: var(--print); transition: width .5s; }
  .temps { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .temp { background: var(--inset); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-size: 12px; }
  .temp b { font-size: 14px; }
  .amsGrid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tray { border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 11px; min-width: 72px; background: var(--inset); }
  .tray.active { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid #333; }
  .cmds { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .panel { margin-top: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; background: var(--inset); }
  .panel h4 { margin: 0 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
  .dtabBody { padding: 6px 2px; }
  .devLine { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--dim); margin-top: 6px; }
  .nozzleGrid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .nozzleCard { border: 1px solid var(--line2); border-radius: 4px; padding: 6px 10px; font-size: 12px; background: var(--inset); min-width: 96px; }
  .nozzleCard.active { border-color: var(--amber); box-shadow: inset 0 0 0 1px rgba(255, 176, 46, .35); }
  .fileRow { display: flex; gap: 6px; align-items: center; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed #1d2530; }
  .fileRow .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 机器助手报错事件区（HMS/错误码） */
  .errBox { margin: 6px 0; padding: 8px 12px; background: rgba(255, 93, 93, .07); border: 1px solid rgba(255, 93, 93, .4);
    border-left: 3px solid var(--bad); border-radius: 3px; font-size: 12px; color: #ffb3b3; line-height: 1.8; }
  /* 任务残留条（2026-10-16）：机器已停止但固件挂着 FAILED，非活跃告警——琥珀色信息口径 */
  .residueBox { margin: 6px 0; padding: 8px 12px; background: rgba(217, 179, 43, .07); border: 1px solid rgba(217, 179, 43, .45);
    border-left: 3px solid #d9b32b; border-radius: 3px; font-size: 12px; color: #e8cf8a; line-height: 1.8; }
  .coldBox { margin: 6px 0; padding: 5px 12px; background: rgba(126, 138, 153, .06); border: 1px solid var(--line2);
    border-radius: 3px; font-size: 11px; color: var(--dim); line-height: 1.7; }
  .tempRow { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 6px 0; }
  .tempRow input[type=number] { width: 90px; background: var(--inset); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 4px 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
  .row label { font-size: 11px; color: var(--dim); min-width: 64px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 3px 10px; font-size: 11px; }
  .seg button.on { background: var(--amber); color: #14100a; font-weight: 700; }
  .fanline { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); flex: 1; min-width: 200px; }
  .fanline input[type=range] { flex: 1; width: auto; }
  .fanline .fval { min-width: 56px; text-align: right; }
  .jog { display: grid; grid-template-columns: repeat(5, 44px); gap: 3px; margin: 4px 0; }
  .jog button { padding: 3px 0; font-size: 11px; }
  .gline { display: flex; gap: 6px; margin-top: 6px; }
  .gline input { flex: 1; font-family: Consolas, monospace; font-size: 12px; }
  .dangerNote { font-size: 11px; color: var(--bad); margin: 4px 0; }
  button { background: var(--bg2); color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: #1d2632; }
  button.bad { background: #4a2321; border-color: #6e332f; }
  button.ok { background: #1e3a2a; border-color: #2d5c40; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--line); padding: 8px 18px; border-radius: 4px; display: none; z-index: 9; }
  .loginBox { max-width: 360px; margin: 80px auto; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 20px; }
  input { background: var(--inset); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 6px 10px; width: 100%; }
  .meta { color: var(--dim); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="loginBox" id="loginBox" style="display:none">
  <h2>🔐 登录设备观察台</h2>
  <div style="margin:8px 0"><input id="username" placeholder="用户名"></div>
  <div style="margin:8px 0"><input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="ok" style="width:100%" onclick="doLogin()">登录</button>
  <div class="detail" id="loginHint" style="margin-top:8px"></div>
</div>

<div class="wrap" id="appBody" style="display:none">
  <div class="head">
    <div class="brandbar">
      <div class="brandmark">QL</div>
      <div>
        <h1>千里战队3D打印预约中心 · 设备观察台<span class="en">QIANLI · DEVICE CONSOLE</span></h1>
        <div class="sub">拓竹（MQTT 推送）+ 闪铸（HTTP 轮询）双链路 · 画面经本服务内网代理 · 设备全量控制 · 每 5s 刷新　<a href="/index.html">← 返回预约中心</a></div>
      </div>
    </div>
    <div class="userbox" id="userbox"></div>
  </div>
  <div class="grid" id="fleet"><div class="detail">加载中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="/vendor/jmuxer.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ME = null;
let IS_REVIEWER = false; // reviewer 及以上：低危指令（暂停/恢复/灯/速度/风扇）
let IS_ADMIN = false;    // admin：危险指令（停止/gcode/动机械）

// 每台拓竹机的解码器现场（camera kind=p1stream/rtsp 共用）：ws / decoder / canvas 句柄
const h264Sessions = new Map();

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

function applyRole() {
  IS_REVIEWER = ['reviewer', 'admin'].includes(ME.role);
  IS_ADMIN = ME.role === 'admin';
}

async function loadMe() {
  const res = await fetch('/api/auth/me');
  if (res.ok) { ME = await res.json(); applyRole(); return true; }
  return false;
}

async function doLogin() {
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $('loginHint').textContent = '❌ ' + (data.error || '登录失败'); return; }
  ME = data; applyRole();
  enter();
}

function enter() {
  $('loginBox').style.display = 'none';
  $('appBody').style.display = 'block';
  $('userbox').innerHTML = `<span class="sub">${esc(ME.displayName)}（${esc(ME.role)}）</span> <button onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>location.reload())">退出</button>`;
  loadFleet();
  setInterval(loadFleet, 5000);
}

// ---------- 机队渲染 ----------

function statusBadge(p) {
  const staleIdle = p.stateStale && ['空闲', '已完成'].includes(p.status);
  const color = staleIdle ? '#98a4b0' : ({ '空闲': 'var(--ok)', '已完成': 'var(--ok)', '打印中': 'var(--print)', '暂停': 'var(--warn)', '故障': 'var(--bad)', '准备中': 'var(--warn)', '切片中': 'var(--warn)' }[p.status] || '#5b6ee1');
  return `<span class="badge" style="background:${color}">${esc(p.status)}${p.stateStale ? '<span class="staleTag">失联</span>' : ''}</span>`;
}

function trayHtml(t) {
  const sw = t.colorHex ? `<span class="swatch" style="background:#${esc(t.colorHex)}"></span>` : '';
  const remain = t.remain != null && t.remain > 0 ? ` · 余 ${Math.round(t.remain)}%` : '';
  return `<div class="tray${t.active ? ' active' : ''}" title="${t.active ? '当前供料槽' : ''}">${sw}<b>${esc(t.slot)}</b>${remain}<br>${esc(t.type || '—')}</div>`;
}

function amsSection(p) {
  const trays = p.ams || [];
  if (!trays.length) {
    // 闪铸直进料等无料站机型：显示供料形态说明而非空白
    return `<div class="amsGrid"><div class="tray">无料站信息${p.brand === 'flashforge' ? '（直进料机型）' : '（未上报/未连接）'}</div></div>`;
  }
  const label = p.brand === 'flashforge' ? '供料' : 'AMS';
  return `<div class="detail" style="margin-top:6px">${label}：</div><div class="amsGrid">${trays.map(trayHtml).join('')}</div>`;
}

function camSection(p) {
  const id = p.id;
  if (p.camera === 'mjpeg') {
    return `<div class="cam"><img src="/api/printers/${id}/camera/mjpeg?t=${Date.now()}" alt="画面"
      onerror="this.parentElement.innerHTML='<div class=ph>📷 画面不可用——机型无摄像头或打印机离线</div>'">
      <span class="camTag">MJPEG · 闪铸 8080</span></div>`;
  }
  if (p.camera === 'p1stream' || p.camera === 'rtsp') {
    const tag = p.camera === 'rtsp' ? 'RTSPS 322 · X1/H2D' : 'TCP 6000 · P1/A1';
    return `<div class="cam" id="cam${id}">
      <div class="ph" id="camPh${id}">📷 拓竹本地流（${tag}，H.264）——点「连接画面」经服务端中继拉流</div>
      <canvas id="camCv${id}" style="display:none" width="640" height="360"></canvas>
      <video id="camVideo${id}" style="display:none" muted playsinline autoplay></video>
      <button class="camBtn" id="camBtn${id}" onclick="toggleH264Stream(${id}, this)">▶ 连接画面</button>
      <span class="camTag">${tag}</span>
    </div>`;
  }
  return '';
}

/** 「动机械」类指令的状态门（与服务端 canJogMachine 同口径） */
function machineIdle(p) {
  return ['IDLE', 'FINISH', 'FAILED'].includes(String(p.gcodeState || '').toUpperCase());
}

/** /sdcard 文件列表缓存（点「加载」才拉，不随 5s 轮询刷） */
const filesCache = new Map();
let FLEET = []; // 最近一轮机队状态（文件列表等异步渲染用真机上下文）

const SPEED_NAMES = { 1: '静默', 2: '标准', 3: '竞速', 4: '疯狂' };

/** 风扇上报值（0-15 档或 0-255）→ 百分比 */
function fanPct(v) {
  if (v == null) return null;
  const n = Number(v);
  if (!Number.isFinite(n)) return null;
  return Math.round((n <= 15 ? n / 15 : n / 255) * 100);
}



/**
 * 控制面板（2026-10-15 曼波令：向拓竹原生（Bambu Studio Device 页）靠拢）：
 * 去页签改单页分区堆叠——温度 → AMS → 控制（速度/风扇）→ 移动 → 维护 → gcode。
 * 分区标题带左侧色条，信息组织与原生一致；打印中/失联状态锁定动机械与校准。
 */
function controlPanelHtml(p) {
  if (!IS_REVIEWER) return '<div class="meta">控制指令仅审批人及以上可用</div>';
  const bambu = p.brand !== 'flashforge';
  const idle = machineIdle(p) && !p.stateStale;
  const lockNote = !idle ? '<span class="detail" style="color:var(--warn)">（非空闲/失联，已锁定）</span>' : '';
  const lampPair = (lamp, label) => `
    <button onclick="cmdPost(${p.id},'light',{on:true,lamp:'${lamp}'},'打开 ${esc(p.name)} ${label}？')">💡${label}开</button>
    <button onclick="cmdPost(${p.id},'light',{on:false,lamp:'${lamp}'},'关闭${label}？')">🔅${label}关</button>`;
  const quickBar = `<div class="cmds">
      ${p.status === '打印中' ? `<button onclick="cmdPost(${p.id},'pause',null,'暂停打印？')">⏸ 暂停</button>` : ''}
      ${p.status === '暂停' ? `<button class="ok" onclick="cmdPost(${p.id},'resume',null,'恢复打印？')">▶ 恢复</button>` : ''}
      ${lampPair('chamber', '腔灯')}
      ${bambu ? lampPair('work', '工作灯') : ''}
      ${IS_ADMIN ? `<button class="bad" onclick="cmdPost(${p.id},'stop',null,'⚠️ 停止打印？停机不可恢复，耗材作废')">⏹ 停止</button>` : ''}
    </div>`;
  if (!bambu) {
    return quickBar + '<div class="meta">闪铸机型：控制面暂限暂停/恢复/灯/停止</div>';
  }

  // 🌡 温度（原生风格：当前/目标 + 快捷步进）
  const tempRow = (kind, label, id, cur, tgt, max) => `
    <div class="tempRow"><label style="min-width:88px">${label}</label>
      <b style="min-width:74px">${cur ?? '—'}° <span class="detail">/ ${tgt != null ? tgt + '°' : '—'}</span></b>
      <input type="number" id="${id}In${p.id}" min="0" max="${max}" value="${tgt != null ? tgt : 0}" style="width:74px">
      <button class="ok" onclick="setTemp(${p.id},'${kind}')">设定</button>
      <button class="mini" onclick="adjustTemp(${p.id},'${kind}',-10)">−10</button>
      <button class="mini" onclick="adjustTemp(${p.id},'${kind}',10)">+10</button>
      <button class="mini" onclick="cmdPost(${p.id},'temp',{kind:'${kind}',deg:0},null,true)">归零</button></div>`;
  // 双喷头（H2D，2026-10-16）：nozzles 数组时按喷头卡渲染；单喷头保持原行
  const multiNozzle = Array.isArray(p.nozzles) && p.nozzles.length >= 2;
  const activeNz = multiNozzle ? (p.nozzles.find((n) => n.active) || p.nozzles[0]) : null;
  // 左右喷嘴命名（2026-10-16 官方打印区实锤）：ext0=左（外挂料盘）、ext1=右（AMS）
  const nzName = (nz) => (nz.side === 'left' ? '左喷嘴（外挂料盘）' : nz.side === 'right' ? '右喷嘴（AMS）' : `喷头 ${nz.id + 1}`);
  const nozzleBlock = multiNozzle
    ? `<div class="nozzleGrid">${p.nozzles.map((nz) => `
        <div class="nozzleCard${nz.active ? ' active' : ''}">
          <b>${nzName(nz)}</b>${nz.active ? ' <span class="detail">◀ 当前</span>' : ''}
          <div><b style="font-size:16px">${nz.temp != null ? nz.temp + '°' : '—'}</b>${nz.target != null ? ` <span class="detail">/ ${nz.target}°</span>` : ''}</div>
          <div class="detail">${nz.diameter != null ? nz.diameter + 'mm' : '—'} ${esc(nz.type || '')}</div>
        </div>`).join('')}</div>`
    : tempRow('nozzle', '喷嘴', 'nt', p.nozzleTemp, p.nozzleTargetTemp, 350);
  const tempSection = `<div class="panel"><h4>🌡 温度（打印中可调）</h4>
    ${nozzleBlock}
    ${tempRow('bed', '热床', 'bt', p.bedTemp, p.bedTargetTemp, 120)}
    ${multiNozzle ? '<div class="detail">双喷头机型：目标温度设定作用于当前喷头（' + (activeNz ? nzName(activeNz) : '?') + '）</div>' : ''}</div>`;

  // 📦 AMS（原生风格：色块 + 材料 + 余量）
  const trays = p.ams || [];
  const hum = p.deviceInfo && p.deviceInfo.amsHumidity;
  const trayCards = trays.length ? trays.map((t) => {
    // 切槽参数（2026-10-16）：外挂料盘 ams_id=254/255、槽 0；AMS 按名称解析单元/槽位
    const m = /AMS (\d+)/.exec(t.slot || '');
    const switchArgs = t.external
      ? { amsId: Number.isInteger(t.amsId) ? t.amsId : 254, trayId: 0 }
      : { amsId: 0, trayId: m ? Number(m[1]) : 0 };
    const remain = t.remain != null && t.remain > 0 ? Math.round(t.remain) : null;
    return `<div class="tray${t.active ? ' active' : ''}" style="min-width:124px">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="swatch" style="width:18px;height:18px;background:#${esc(t.colorHex || '333')}"></span>
        <b>${esc(t.slot)}</b>${t.active ? ' <span style="color:var(--ok)">◀</span>' : ''}
      </div>
      <div class="detail" style="margin-top:2px">${esc(t.type || '空')}</div>
      ${remain != null ? `<div class="pbar" style="height:4px;margin-top:3px"><div style="width:${Math.min(100, remain)}%"></div></div><div class="detail">剩余 ${remain}%</div>` : ''}
      <div style="margin-top:4px"><button class="mini" ${idle && !t.active ? '' : 'disabled'} title="${idle ? '切到此槽进料' : '非空闲态/当前槽不可切'}"
        onclick="cmdPost(${p.id},'ams/switch',{amsId:${switchArgs.amsId},trayId:${switchArgs.trayId}},'切到 ${esc(t.slot)} 进料？（先退旧料再进新料）')">切此槽</button></div></div>`;
  }).join('') : '<span class="detail">无料站信息</span>';
  // AMS 单元级数据（2026-10-16 全量排查）：湿度双值/AMS 内温/烘干倒计时
  const amsU = Array.isArray(p.amsUnits) ? p.amsUnits[0] : null;
  const amsMeta = amsU
    ? `<span class="detail">${amsU.humidity != null ? `湿度 ${amsU.humidity}/5${amsU.humidityRaw != null ? `（${amsU.humidityRaw}%）` : ''}` : ''}${amsU.temp != null ? ` · 内温 ${amsU.temp}°` : ''}${amsU.dryTime > 0 ? ` · 🔥 烘干中 剩 ${amsU.dryTime} 分钟` : ''}</span>`
    : '';
  const amsSection = `<div class="panel"><h4>📦 AMS 耗材 ${amsMeta || (hum != null ? `<span class="detail">湿度 ${hum}/5</span>` : '')}</h4>
    <div class="opts" style="display:flex;gap:6px;flex-wrap:wrap">${trayCards}</div></div>`;

  // 🎮 控制（速度 + 风扇——原生「控制」区）
  const fanRows = ['aux', 'part', 'chamber'].map((k) => {
    const names = { aux: '辅助扇', part: '模型扇', chamber: '腔室扇' };
    const pct = fanPct((p.fans || {})[k]);
    return `<div class="fanline"><label>${names[k]}</label>
      <input type="range" min="0" max="100" step="5" value="${pct != null ? pct : 0}"
        onchange="cmdPost(${p.id},'fan',{kind:'${k}',speed:Math.round(this.value/100*255)},null,true)">
      <span class="fval">现 ${pct != null ? pct + '%' : '—'}</span></div>`;
  }).join('');
  const controlSection = `<div class="panel"><h4>🎮 控制</h4>
    <div class="row"><label>速度档</label><span class="seg">${[1, 2, 3, 4].map((n) =>
      `<button class="${p.speedLevel === n ? 'on' : ''}" onclick="cmdPost(${p.id},'speed',{level:${n}},'切到${SPEED_NAMES[n]}档速度？')">${n} ${SPEED_NAMES[n]}</button>`).join('')}</span></div>
    ${fanRows}</div>`;

  // 🕹 移动（Jog + 回原点）
  const jog = (axis, d) => `<button ${idle ? '' : 'disabled'} onclick="cmdPost(${p.id},'move',{axis:'${axis}',distance:${d}},null,true)">${axis.toUpperCase()}${d > 0 ? '+' + d : d}</button>`;
  const motionSection = IS_ADMIN ? `<div class="panel"><h4>🕹 移动 ${lockNote}</h4>
    <div class="row"><button ${idle ? '' : 'disabled'} onclick="cmdPost(${p.id},'home',null,'回原点（G28）？')">🏠 回原点</button>
      <span class="detail">单步位移：XY ±10/±1mm（Z ±5/±1mm），相对移动</span></div>
    <div class="jog">${jog('x', -10)}${jog('x', -1)}${jog('x', 1)}${jog('x', 10)}<span></span>${jog('y', -10)}${jog('y', -1)}${jog('y', 1)}${jog('y', 10)}<span></span>${jog('z', -5)}${jog('z', -1)}${jog('z', 1)}${jog('z', 5)}</div></div>` : '';

  // 🛠 维护（校准 + 退料 + 文件）
  const files = filesCache.get(p.id);
  const maintSection = IS_ADMIN ? `<div class="panel"><h4>🛠 维护校准 ${lockNote}</h4>
    <div class="row">
      <button ${idle ? '' : 'disabled'} onclick="cmdPost(${p.id},'calibrate',{type:'full'},'全量校准？耗时较长')">🎯 全量校准</button>
      <button ${idle ? '' : 'disabled'} onclick="cmdPost(${p.id},'calibrate',{type:'level'},'自动调平？')">📏 自动调平</button>
      <button ${idle ? '' : 'disabled'} onclick="cmdPost(${p.id},'calibrate',{type:'vib'},'振动补偿校准？')">〰 振动补偿</button>
      <button ${idle ? '' : 'disabled'} class="bad" onclick="cmdPost(${p.id},'unload',null,'退料？喷头会加热并抽丝')">⤴ 退料</button>
    </div>
    <div class="row" style="margin-top:8px"><label>📂 打印机文件</label>
      <button class="mini" onclick="loadSdcardFiles(${p.id})">${files ? '刷新' : '加载列表'}</button>
      <span class="detail">选中 3mf 可直接开打</span></div>
    <div id="filesBox${p.id}">${files ? renderFiles(p, files) : '<div class="detail">未加载</div>'}</div></div>` : '';

  // ⌨️ gcode 台
  const gcodeSection = IS_ADMIN ? `<div class="panel"><h4>⌨️ gcode 直控台</h4>
    <div class="dangerNote">⚠️ 任意 G-code 直接下发（M104 S220 设温度 / M106 S255 风扇…），打错命令后果自负</div>
    <div class="gline">
      <input id="gcodeIn${p.id}" placeholder="G-code 行，如 M104 S220" onkeydown="if(event.key==='Enter')sendGcode(${p.id})">
      <button class="bad" onclick="sendGcode(${p.id})">下发</button>
    </div></div>` : '';

  return quickBar + tempSection + amsSection + controlSection + motionSection + maintSection + gcodeSection;
}

/** 温度步进（原生风）：读当前输入框值 ±delta 后下发 */
function adjustTemp(id, kind, delta) {
  const input = $(kind === 'nozzle' ? `ntIn${id}` : `btIn${id}`);
  const base = Number(input && input.value) || 0;
  const next = Math.max(0, base + delta);
  if (input) input.value = next;
  cmdPost(id, 'temp', { kind, deg: next }, null, true);
}

function renderFiles(p, files) {
  if (!files.length) return '<div class="detail">/sdcard 无切片文件</div>';
  return files.map((f) => `<div class="fileRow">
    <span class="fname" title="${esc(f.name)}">${esc(f.name)}</span>
    <span class="detail">${(f.size / 1048576).toFixed(1)}MB</span>
    <button class="mini" ${machineIdle(p) ? '' : 'disabled'} onclick="printSdcardFile(${p.id},'${esc(f.name).replace(/'/g, '\\&#39;')}')">▶ 开打</button>
    <button class="mini bad" onclick="delSdcardFile(${p.id},'${esc(f.name).replace(/'/g, '\\&#39;')}')">删</button>
  </div>`).join('');
}

async function loadSdcardFiles(id) {
  const res = await fetch(`/api/printers/${id}/files`);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return toast('❌ ' + (data.error || '列表失败'));
  filesCache.set(id, data);
  const box = $(`filesBox${id}`);
  if (box) box.innerHTML = renderFiles(FLEET.find((p) => p.id === id) || { gcodeState: '' }, data);

async function printSdcardFile(id, name) {
  if (!confirm(`⚠️ 直接开打 /sdcard/${name}？（切片参数随文件，立即分发）`)) return;
  await cmdPost(id, 'print-sdcard', { fileName: name }, null, true);
  setTimeout(loadFleet, 1200);
}

async function delSdcardFile(id, name) {
  if (!confirm(`删除 /sdcard/${name}？不可恢复`)) return;
  await cmdPost(id, 'files/delete', { name }, null, true);
  const files = (filesCache.get(id) || []).filter((f) => f.name !== name);
  filesCache.set(id, files);
  const box = $(`filesBox${id}`);
  if (box) box.innerHTML = renderFiles(FLEET.find((p) => p.id === id) || { gcodeState: '' }, files);
}

async function setTemp(id, kind) {
  const input = $(kind === 'nozzle' ? `ntIn${id}` : `btIn${id}`);
  const deg = Number(input && input.value);
  if (!Number.isInteger(deg) || deg < 0) return toast('温度必须是 ≥0 的整数');
  await cmdPost(id, 'temp', { kind, deg }, null, true);
  setTimeout(loadFleet, 1000);
}

/** HMS 硬件通知码 → 已知解释（2026-10-15 起积累；未知码引导看打印机屏幕） */
const HMS_KNOWN = {
  // attr-code 组合键（原始码）
  '84082688-196649': '检查打印机（历史通知码，如仍在屏上提示请跟随屏指导）',
};

/** HMS ts_unix（"20261007142817"）→ 毫秒；无法解析返回 0 */
function hmsTs(h) {
  const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(String(h.ts_unix || h.ts || ''));
  if (!m) return 0;
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
}

/**
 * 机器助手报错事件区（实时性口径，2026-10-16 二次修——曼波反馈「机子没报错还显示」）：
 *   - print_error/fail_reason 打印机会持久保留——仅**活动打印**（打印中/暂停/准备中）
 *     或**有在打痕迹的故障**（FAILED 且 activeTask/进度>0）作红色活跃告警；
 *   - FAILED 且机器静止 = 任务终止残留（H2 固件在取消/失败后不清 gcode_state，
 *     屏幕首页无报错也照样回传）——降级为「任务残留」信息条 + 一键清除；残留不清，
 *     分发匹配（白名单仅空闲/已完成）永远选不中这台机器 = 队列静默卡死的根因之一；
 *   - 已知码翻译成人话（50348044=HMS 0300-400C 取消码，实锤）；未知码保留原始值引导看屏；
 *   - HMS 通知按时间戳过滤：超 24h 的历史码折叠为灰色一行，活跃码醒目显示
 */
const FAIL_REASON_KNOWN = {
  50348044: '打印已取消（停止/外部中断，非硬件故障）',
};

function errorSection(p) {
  const tr = (code) => (FAIL_REASON_KNOWN[code] ? `（${FAIL_REASON_KNOWN[code]}）` : '');
  const printing = ['打印中', '暂停', '准备中'].includes(p.status);
  const failedActive = p.status === '故障' && (p.activeTask || Number(p.progress) > 0);
  const residue = p.status === '故障' && String(p.gcodeState || '').toUpperCase() === 'FAILED' && !failedActive;
  const hot = [];
  const cold = [];
  if (printing || failedActive) {
    if (p.printError) hot.push(`⛔ 打印错误码 <b>${p.printError}</b>${tr(p.printError)}（详情见打印机屏幕）`);
    if (p.failReason && p.failReason !== p.printError) hot.push(`⚠️ 失败原因码 <b>${p.failReason}</b>${tr(p.failReason)}`);
  } else if (residue) {
    const code = p.failReason || p.printError || 0;
    const codeLine = code ? `失败码 <b>${code}</b>${tr(code)}；` : '';
    hot.push(`<div class="residueBox">🔸 <b>任务残留状态</b>：上次打印已终止（${codeLine}）机器已停止但固件仍标记故障——`
      + `屏幕首页无报错属正常现象；<b>残留不清除，新任务不会被自动分发到这台机器</b>。`
      + `若清除指令无效，可在机器屏幕处理该任务或重启打印机电源。`
      + (IS_ADMIN ? `<div style="margin-top:5px"><button class="mini" onclick="clearResidue(${p.id},'${esc(p.name)}')">🧹 清除任务残留（让机器回空闲）</button></div>` : '')
      + `</div>`);
  }
  const now = Date.now();
  for (const h of (p.hms || [])) {
    const known = HMS_KNOWN[`${h.attr}-${h.code}`];
    const ts = hmsTs(h);
    const line = `🔔 HMS ${h.attr}-${h.code}${known ? '：' + esc(known) : '（未收录码——看打印机屏幕获取详情）'}`;
    if (ts && now - ts > 24 * 3600 * 1000) cold.push(line);
    else hot.push(line);
  }
  if (!hot.length && !cold.length) return '';
  const parts = [];
  // 残留条自带琥珀样式：单独输出，不套红色 errBox 外衣
  const residueIdx = hot.findIndex((s) => s.includes('residueBox'));
  if (residueIdx >= 0) {
    parts.push(hot[residueIdx]);
    hot.splice(residueIdx, 1);
  }
  if (hot.length) parts.push(`<div class="errBox">${hot.map((s) => `<div>${s}</div>`).join('')}</div>`);
  if (cold.length) parts.push(`<div class="coldBox">📋 历史通知（>24h 折叠）：${cold.join('；')}</div>`);
  return parts.join('');
}

/** 清除任务残留（admin，2026-10-16 v2）：后端为状态验证链（候选逐发+轮询离开 FAILED，
 *  最长约 1 分钟）——结果按机器实际状态如实报告，不再以「指令送达」当成功 */
async function clearResidue(id, name) {
  if (!confirm(`清除 ${name} 的残留故障状态？\n\n· 机器当前已停止，本操作无物理动作（验证链最长约 1 分钟）\n· 清除成功后机器回「空闲」，队列中的任务会自动开始打印`)) return;
  toast('⏳ 正在清除并等待机器响应…');
  let res;
  let data = {};
  try {
    res = await fetch(`/api/printers/${id}/clear-error`, { method: 'POST' });
    data = await res.json().catch(() => ({}));
  } catch (err) {
    return toast('❌ 网络错误：' + err.message);
  }
  if (res.status === 401) { location.reload(); return; }
  if (!res.ok) return toast('❌ ' + (data.error || '清除失败'));
  if (data.cleared) toast(`✅ 清除成功（${data.state || '空闲'}），机器已回空闲`);
  else toast('⚠️ ' + (data.note || '指令被受理但状态未变化'));
  setTimeout(loadFleet, 3000);
}

async function loadFleet() {
  // 5s 重渲染跳过条件（v56 复查批收窄）：仅在拖风扇滑条/输 gcode 等连续输入时跳过——
  // 此前按「焦点在 .panel 内」一刀切，页签按钮也在面板内 → 点页签永远不刷新（全部失灵）
  const ae = document.activeElement;
  const inContinuousInput = ae && ae.tagName === 'INPUT' && ae.closest && ae.closest('.fanline,.gline');
  if (inContinuousInput) return;
  // MSE 会话守卫（2026-10-16）：jmuxer 持有 video 元素引用，卡片重绘会换掉 DOM 导致画面丢失——
  // MSE 观看期间跳过整绘（状态数字暂不刷新，断开画面即恢复；WebCodecs 路径不受影响）
  for (const ses of h264Sessions.values()) { if (ses.mode === 'mse') return; }
  const res = await fetch('/api/printers');
  if (res.status === 401) { location.reload(); return; }
  const printers = await res.json();
  if (!Array.isArray(printers) || !printers.length) { $('fleet').innerHTML = '<div class="detail">暂无登记打印机（.env PRINTER_HOSTS）</div>'; return; }
  FLEET = printers;
  $('fleet').innerHTML = printers.map(cardHtml).join('');
  // h264 会话保持：5s 重渲染会重画 DOM——活会话不重建（解码器动态寻址新画布，
  // 下一帧自动续画），只复活真正死掉的会话；v56 修复：原实现每轮删掉重建，
  // 旧 WS 不关 → 每 5s 泄漏一条 WS+RTSPS 会话，打满 LIVE555 会话额后新会话被拒
  for (const [id, ses] of h264Sessions) {
    const alive = printers.find((p) => p.id === id && (p.camera === 'p1stream' || p.camera === 'rtsp'));
    if (!alive) { closeH264Stream(id); continue; }
    const wsDead = !ses.ws || ses.ws.readyState > 1; // CLOSING/CLOSED
    if (ses.wantWatch && wsDead) { h264Sessions.delete(id); startH264Stream(id, true); }
  }
}

// ---------- 指令 ----------

async function cmdPost(id, path, body, confirmText, silentConfirm) {
  if (confirmText && !confirm(confirmText)) return false;
  let res;
  try {
    res = await fetch(`/api/printers/${id}/${path}`, {
      method: 'POST',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    // 网络不可达（服务没起/断网）绝不静默——明确告知，避免「点了没反应」
    toast('❌ 网络错误：服务不可达（' + err.message + '）');
    return false;
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { location.reload(); return false; }
  toast(res.ok ? '✅ 指令已下发' : '❌ ' + (data.error || (res.status === 403 ? '权限不足' : '指令失败')));
  if (!silentConfirm) setTimeout(loadFleet, 800);
  return res.ok;
}

function sendGcode(id) {
  const input = $(`gcodeIn${id}`);
  const line = (input.value || '').trim();
  if (!line) return;
  if (!confirm(`⚠️ 向打印机下发 G-code：\n\n${line}\n\n确认执行？`)) return;
  cmdPost(id, 'gcode', { line }, null, true).then((ok) => { if (ok) input.value = ''; });
}

// ---------- 拓竹画面：WS 中继 + WebCodecs H.264 解码（P1 裸流 / H2D RTSPS 通用） ----------

/** 从 Annex-B 字节流拆 NALU（start code 00 00 01 前缀），返回 [NALU...] */
function splitAnnexB(buf) {
  const u8 = new Uint8Array(buf);
  const nals = [];
  let start = -1;
  for (let i = 0; i + 2 < u8.length; i++) {
    if (u8[i] === 0 && u8[i + 1] === 0 && u8[i + 2] === 1) {
      if (start >= 0) nals.push(u8.subarray(start, i - (u8[i - 1] === 0 ? 1 : 0)));
      start = i + 3;
    }
  }
  if (start >= 0 && start < u8.length) nals.push(u8.subarray(start));
  return nals;
}

function nalType(nal) { return nal[0] & 0x1f; }

/** SPS → avc codec 串（profile_idc.constraint_flags.level_idc） */
function codecFromSps(sps) {
  const hex = (n) => n.toString(16).padStart(2, '0');
  return `avc1.${hex(sps[1])}${hex(sps[2])}${hex(sps[3])}`;
}

function toggleH264Stream(id, btn) {
  if (h264Sessions.has(id)) closeH264Stream(id);
  else startH264Stream(id);
}

async function startH264Stream(id, auto = false) {
  // 活会话防重入（v56）：WS 还在连/开就只重绑按钮——重渲染不会再走到这（loadFleet 只复活死会话）
  const existing = h264Sessions.get(id);
  if (existing && existing.ws && existing.ws.readyState <= 1) {
    const b = $(`camBtn${id}`);
    if (b) { b.textContent = '⏹ 断开'; b.onclick = () => closeH264Stream(id); }
    return;
  }
  if (existing) closeH264Stream(id);
  const ph = $(`camPh${id}`), btn = $(`camBtn${id}`);
  if (!ph) return;
  const ses = { wantWatch: true, ws: null, decoder: null, pending: [], sps: null, pps: null, keySeen: false, ts: 0, frameCount: 0 };
  h264Sessions.set(id, ses);
  btn.textContent = '⏹ 断开';
  btn.onclick = () => closeH264Stream(id);
  ph.textContent = '🔄 连接中继…';

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  try {
    ws = new WebSocket(`${proto}://${location.host}/api/printers/${id}/camera/h264`);
  } catch (err) {
    ph.textContent = '❌ 中继连接失败：' + err.message;
    return;
  }
  ses.ws = ws;
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => { const p = $(`camPh${id}`); if (p) p.textContent = '📡 已连接中继，等待打印机推流…（若长期无数据：检查打印机 LAN 模式/画面端口）'; };
  ws.onerror = () => { const p = $(`camPh${id}`); if (p) p.textContent = '❌ 中继连接失败（登录态失效或打印机不可达）'; };
  ws.onclose = () => {
    if (h264Sessions.get(id) === ses) {
      const p = $(`camPh${id}`);
      if (p) p.textContent = '⏹ 画面已断开';
      try { ses.decoder && ses.decoder.close(); } catch { /* 已关 */ }
  try { ses.jmuxer && ses.jmuxer.destroy(); } catch { /* MSE 清理（10-16） */ }
      h264Sessions.delete(id);
      const b = $(`camBtn${id}`);
      if (b) { b.textContent = '▶ 连接画面'; b.onclick = () => startH264Stream(id); }
    }
  };

  // 解码路径选择（2026-10-16 双通道）：
  //   WebCodecs 可用（HTTPS / localhost）→ canvas 低延迟直解（首选）
  //   WebCodecs 不可用（HTTP 非 localhost / 内嵌 Electron 内核）→ **MSE fallback**：
  //     jmuxer 把 H.264 Annex-B 实时 remux 成 fMP4 喂 <video>（MSE 无安全上下文要求）
  //     —— IAB 不认自签证书打不开 HTTPS，MSE 是它在 HTTP 下看画面的唯一路径
  ses.mode = ('VideoDecoder' in window) ? 'webcodecs' : 'mse';
  if (ses.mode === 'mse' && !window.JMuxer) {
    ph.textContent = '⚠️ 解码器不可用（WebCodecs/MSE 均缺失）——请用 Chrome/Edge 系浏览器访问';
    ws.close();
    return;
  }
  if (ses.mode === 'mse') {
    // MSE 播放器：video 元素绑定（jmuxer 持有元素引用，故 MSE 会话存续期间
    // loadFleet 跳过卡片重绘——见 loadFleet 的 MSE 守卫）
    const videoNow = $(`camVideo${id}`);
    if (!videoNow) { ph.textContent = '❌ 播放器元素缺失'; ws.close(); return; }
    videoNow.style.display = 'block';
    ph.style.display = 'none';
    ses.jmuxer = new window.JMuxer({
      node: videoNow,
      mode: 'video',
      flushingTime: 0, // 最少缓冲，压低延迟
      fps: 30,
      debug: false,
    });
    toast(`✅ ${id} 号机画面已接通（MSE 通道）`);
  }

  ses.decoder = ses.mode === 'webcodecs' ? new VideoDecoder({
    output: (frame) => {
      ses.frameCount++;
      // 画布/占位动态寻址：5s 重渲染会替换 DOM，解码器持有的旧引用会失效——
      // 每帧按 id 取当前元素，活会话跨重渲染无缝续画（v56 修复）
      const cvNow = $(`camCv${id}`), phNow = $(`camPh${id}`);
      if (!cvNow) { frame.close(); return; }
      cvNow.style.display = 'block';
      if (phNow) phNow.style.display = 'none';
      // 首帧起按实际分辨率校准画布
      if (cvNow.width !== frame.displayWidth || cvNow.height !== frame.displayHeight) {
        cvNow.width = frame.displayWidth; cvNow.height = frame.displayHeight;
      }
      cvNow.getContext('2d').drawImage(frame, 0, 0);
      frame.close();
      if (ses.frameCount === 1) toast(`✅ ${id} 号机画面已接通`);
    },
    error: (e) => { console.error('decoder', e); const p = $(`camPh${id}`); if (p) p.textContent = '❌ 解码失败：' + e.message; },
  }) : null;

  ws.onmessage = (ev) => {
    if (!(ev.data instanceof ArrayBuffer)) return;
    // MSE 通道：原始字节直接喂 jmuxer（它自带 Annex-B 解析）
    if (ses.mode === 'mse') {
      ses.frameCount += 0; // 帧计数交给 video 元素（无法精确）；保持字段
      try { ses.jmuxer.feed({ video: new Uint8Array(ev.data) }); } catch { /* 坏块丢弃 */ }
      return;
    }
    ses.pending.push(new Uint8Array(ev.data));
    // 攒一攒再拆帧（打印机 TCP 分包不按 NALU 对齐）
    if (ses.pending.length < 4 && ses.pending.reduce((a, b) => a + b.length, 0) < 65536) return;
    const total = ses.pending.reduce((a, b) => a + b.length, 0);
    const merged = new Uint8Array(total);
    let off = 0;
    for (const piece of ses.pending) { merged.set(piece, off); off += piece.length; }
    ses.pending = [];

    for (const nal of splitAnnexB(merged.buffer)) {
      const t = nalType(nal);
      if (t === 7) { ses.sps = nal; continue; }   // SPS
      if (t === 8) { ses.pps = nal; continue; }   // PPS
      const isIdr = t === 5;
      if (!isIdr && t !== 1) continue;            // SEI/其他丢弃
      if (isIdr && !ses.keySeen) {
        if (!ses.sps || !ses.pps) continue;       // 等 SPS/PPS 齐了再配解码器
        try {
          ses.decoder.configure({ codec: codecFromSps(spsToBytes(ses.sps)), optimizeForLatency: true });
        } catch (err) {
          ph.textContent = '❌ 解码器配置失败：' + err.message;
          ws.close();
          return;
        }
        ses.keySeen = true;
      }
      if (!ses.keySeen || ses.decoder.state !== 'configured') continue;
      // Annex-B → decoder：key 帧前缀 SPS/PPS，保证随机接入
      const chunks = isIdr ? [ses.sps, ses.pps, nal] : [nal];
      const len = chunks.reduce((a, b) => a + b.length + 4, 0);
      const data = new Uint8Array(len);
      let o = 0;
      for (const c of chunks) {
        data[o++] = 0; data[o++] = 0; data[o++] = 0; data[o++] = 1;
        data.set(c, o); o += c.length;
      }
      try {
        ses.decoder.decode(new EncodedVideoChunk({
          type: isIdr ? 'key' : 'delta',
          timestamp: (ses.ts += 40) * 1000,
          data,
        }));
      } catch { /* 坏帧丢弃 */ }
    }
  };
}

/** NALU 去头（start code 已被 splitAnnexB 剥掉，直接取 body） */
function spsToBytes(sps) { return sps; }

function closeH264Stream(id) {
  const ses = h264Sessions.get(id);
  if (!ses) return;
  ses.wantWatch = false;
  try { ses.ws && ses.ws.close(); } catch { /* 已关 */ }
  try { ses.decoder && ses.decoder.close(); } catch { /* 已关 */ }
  try { ses.jmuxer && ses.jmuxer.destroy(); } catch { /* MSE 清理（10-16） */ }
  h264Sessions.delete(id);
  const b = $(`camBtn${id}`), ph = $(`camPh${id}`), cv = $(`camCv${id}`);
  if (b) { b.textContent = '▶ 连接画面'; b.onclick = () => startH264Stream(id); }
  if (ph) { ph.style.display = ''; ph.textContent = '📷 拓竹本地流——点「连接画面」经服务端中继拉流'; }
  if (cv) cv.style.display = 'none';
}

// ---------- 启动 ----------
(async function init() {
  if (await loadMe()) enter();
  else $('loginBox').style.display = 'block';
})();
</script>
