<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qianli 运维台</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#242e45; --txt:#dbe4f5; --dim:#7c8aa8; --ok:#3fbf6f; --warn:#e2a13c; --err:#e05d5d; --acc:#5b8def; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; padding:18px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  header h1 { font-size:20px; }
  .nas { font-size:13px; color:var(--dim); }
  .badge { display:inline-block; padding:1px 9px; border-radius:10px; font-size:12px; background:var(--line); }
  .badge.ok { color:var(--ok); } .badge.err { color:var(--err); } .badge.warn { color:var(--warn); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(430px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card h2 .port { color:var(--acc); font-weight:600; }
  .card h2 .label { color:var(--dim); font-size:12px; font-weight:400; }
  .role { color:var(--dim); font-size:12.5px; margin:6px 0 8px; }
  .sec { margin-top:8px; font-size:12.5px; }
  .sec b { color:var(--acc); font-weight:600; margin-right:4px; }
  .sec ul { margin:2px 0 0 18px; }
  .sec li { margin:1px 0; }
  .status-row { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
  .btns { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  button { background:var(--line); color:var(--txt); border:1px solid #33405f; border-radius:6px; padding:4px 12px; font-size:12.5px; cursor:pointer; }
  button:hover { background:#2b3750; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { border-color:var(--err); color:var(--err); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .git { font-size:12px; color:var(--dim); margin-top:8px; }
  .git .dirty { color:var(--warn); }
  .git code { color:var(--txt); }
  #drawer { position:fixed; left:0; right:0; bottom:0; height:42vh; background:#0b0f19; border-top:2px solid var(--line); display:none; flex-direction:column; z-index:9; }
  #drawer.open { display:flex; }
  #drawer .bar { display:flex; align-items:center; gap:10px; padding:6px 14px; border-bottom:1px solid var(--line); }
  #drawer pre { flex:1; overflow:auto; padding:10px 14px; font:12px/1.5 Consolas,monospace; white-space:pre-wrap; word-break:break-all; }
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:8; }
  .mask.open { display:block; }
  .toast { position:fixed; top:16px; right:16px; background:var(--card); border:1px solid var(--line); padding:8px 16px; border-radius:8px; display:none; z-index:99; font-size:13px; }
  .win-row { display:flex; align-items:center; gap:6px; margin:5px 0; flex-wrap:wrap; font-size:12.5px; }
  .win-row input { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12.5px; }
  .win-row textarea { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12.5px; width:100%; font-family:inherit; }
  .win-list { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin:6px 0; font-size:12px; }
  .win-list div { margin:3px 0; }
  .badge.method { background:#2b3750; color:var(--acc); }
  .win-panel { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .win-toggle { padding:2px 8px; font-size:12px; }
  #winFloat { position:absolute; z-index:7; background:var(--card); border:1px solid var(--acc); border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.55); display:none; padding:10px 12px; overflow:auto; }
  #winFloat .bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>🖥️ qianli 运维台</h1>
  <span class="nas" id="nasSummary">NAS 状态加载中…</span>
  <span style="flex:1"></span>
  <span class="nas" id="updatedAt"></span>
</header>
<div class="grid" id="grid"></div>
<div id="winFloat"></div>

<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="bar">
    <b id="drawerTitle">日志</b>
    <span style="flex:1"></span>
    <button onclick="closeDrawer()">关闭</button>
  </div>
  <pre id="drawerLog">加载中…</pre>
</div>
<div class="toast" id="toast"></div>

<script>
let DATA = null;
let drawerCtx = null; // {type:'local'|'action'|'nas', id, name}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600);
}

function badge(text, cls) { return `<span class="badge ${cls || ''}">${text}</span>`; }

function sec(title, items) {
  if (!items || !items.length) return '';
  return `<div class="sec"><b>${title}</b><ul>${items.map((i) => `<li>${i}</li>`).join('')}</ul></div>`;
}

function render() {
  if (!DATA) return;
  const nas = DATA.nas;
  document.getElementById('nasSummary').innerHTML = nas.online
    ? `NAS <span class="badge ok">在线</span> 进程：${nas.procs.map((p) => `${p.name} ${badge(p.status, p.status === 'online' ? 'ok' : 'err')}`).join(' ')}`
    : `NAS <span class="badge err">不可达</span> ${nas.error || ''}`;
  document.getElementById('updatedAt').textContent = '更新于 ' + new Date(DATA.time).toLocaleTimeString('zh-CN');

  document.getElementById('grid').innerHTML = DATA.projects.map((p) => {
    const nasBadge = p.pm2Name
      ? (p.nas ? badge(`NAS ${p.nas.status}`, p.nas.status === 'online' ? 'ok' : 'err') : badge('NAS 未发现', 'warn'))
      : badge('仅本机', 'warn');
    const localBadge = p.localRun
      ? (p.localRunning ? badge(p.localHealth ? '本地运行✓健康' : '本地运行', 'ok') : badge('本地未启动', ''))
      : '';
    const git = p.git && p.git.inRepo ? `
      <div class="git">git <code>${p.git.branch}</code> @<code>${p.git.lastCommit.hash}</code> ${p.git.lastCommit.subject.slice(0, 28)}
      ${p.git.dirty ? `<span class="dirty">● ${p.git.dirty} 处未提交</span>` : '<span>（工作区干净）</span>'}</div>` : '';

    const btns = [];
    if (p.localRun) btns.push(p.localRunning
      ? `<button class="danger" onclick="act('/api/local/${p.id}/stop', '停止本地进程', '${p.id}', 'local')">停止本地</button>`
      : `<button class="primary" onclick="act('/api/local/${p.id}/start', '启动本地测试进程', '${p.id}', 'local')">本地测试启动</button>`);
    if (p.localRunning) btns.push(`<button onclick="openLocalLog('${p.id}')">本地日志</button>`);
    (p.quickActions || []).forEach((a) => {
      btns.push(`<button ${p.actionRunning ? 'disabled' : ''} onclick="runQuick('${p.id}', '${a.id}', '${a.label.replace(/'/g, '')}')">${a.label}</button>`);
    });
    if ((p.quickActions || []).some((a) => a.id !== 'push')) {
      btns.push(`<button ${p.actionRunning ? 'disabled' : ''} class="primary" onclick="promptPush('${p.id}')">npm push 部署</button>`);
    }
    if (p.nas) {
      btns.push(`<button onclick="openNasLog('${p.pm2Name}')">NAS 日志</button>`);
      btns.push(`<button class="danger" onclick="nasRestart('${p.pm2Name}')">NAS 重启</button>`);
    }
    if (p.actionRunning) btns.push(`<button onclick="openActionLog('${p.id}')">动作输出中…</button>`);
    else if (p.hasActionLog) btns.push(`<button onclick="openActionLog('${p.id}')">上次动作输出</button>`);

    const winToggle = (p.windows || []).length
      ? `<span style="flex:1"></span><button class="win-toggle" onclick="toggleWinPanel('${p.id}', event)">🧰 定制</button>` : '';

    return `<div class="card" id="card-${p.id}">
      <h2><span class="port">:${p.port}</span> ${p.name} <span class="label">${p.label}</span> ${nasBadge} ${localBadge} ${winToggle}</h2>
      <div class="role">${p.role}</div>
      <div class="status-row">
        <span class="badge">部署：${p.deploy}</span>
        ${p.nas && p.nas.restarts != null ? `<span class="badge">重启 ${p.nas.restarts} 次</span>` : ''}
        ${p.nas && p.nas.uptimeMs ? `<span class="badge">已运行 ${fmtDur(p.nas.uptimeMs)}</span>` : ''}
        ${p.nas && p.nas.memMb ? `<span class="badge">内存 ${p.nas.memMb}MB</span>` : ''}
      </div>
      ${sec('监听', p.listening)}
      ${sec('指令/接口', p.commands)}
      ${sec('权限/边界', p.permissions)}
      ${p.notes ? `<div class="git">📌 ${p.notes}</div>` : ''}
      ${git}
      <div class="btns">${btns.join('')}</div>
    </div>`;
  }).join('');
}

function fmtDur(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时 ' + (m % 60) + ' 分';
  return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 时';
}

async function refresh() {
  try {
    const res = await fetch('/api/overview');
    DATA = await res.json();
    render();
  } catch (err) { console.error(err); }
}

async function act(url, desc, id, logType) {
  const res = await fetch(url, { method: 'POST' });
  const data = await res.json();
  toast(data.ok ? desc + ' ✓' : (data.error || '失败'));
  refresh();
}

function runQuick(id, actionId, label) {
  if (label.includes('测试')) { doAction(id, { actionId }); return; }
  if (!confirm(`在项目上执行「${label}」？`)) return;
  doAction(id, { actionId });
}

function promptPush(id) {
  const p = DATA.projects.find((x) => x.id === id);
  const msg = prompt(`npm run push 部署「${p.name}」\n提交说明：`, 'update: 运维台快捷部署');
  if (msg === null) return;
  if (!confirm(`确认提交并部署到 NAS？\n项目：${p.name}\n说明：${msg}`)) return;
  doAction(id, { cmd: 'push', message: msg });
}

async function doAction(id, body) {
  const res = await fetch(`/api/action/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!data.ok) return toast(data.error || '执行失败');
  toast('已开始执行');
  openActionLog(id);
}

function openDrawer(title) {
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('mask').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('mask').classList.remove('open');
  drawerCtx = null;
}

function openLocalLog(id) {
  const p = DATA.projects.find((x) => x.id === id);
  drawerCtx = { type: 'local', id };
  openDrawer(`本地日志 · ${p.name}`);
  pullLog();
}

function openActionLog(id) {
  const p = DATA.projects.find((x) => x.id === id);
  drawerCtx = { type: 'action', id };
  openDrawer(`动作输出 · ${p.name}`);
  pullLog();
}

function openNasLog(name) {
  drawerCtx = { type: 'nas', name };
  openDrawer(`NAS pm2 日志 · ${name}`);
  pullLog();
}

async function nasRestart(name) {
  if (!confirm(`确认重启 NAS 上的 ${name}？（pm2 restart + save）`)) return;
  const res = await fetch(`/api/nas/restart/${name}`, { method: 'POST' });
  const data = await res.json();
  toast(data.ok ? `${name} 已重启 ✓` : (data.error || '失败'));
  refresh();
}

async function pullLog() {
  if (!drawerCtx) return;
  try {
    const url = drawerCtx.type === 'local' ? `/api/local/${drawerCtx.id}/log`
      : drawerCtx.type === 'action' ? `/api/action/${drawerCtx.id}/log`
      : `/api/nas/log/${drawerCtx.name}`;
    const res = await fetch(url);
    const data = await res.json();
    const pre = document.getElementById('drawerLog');
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    pre.textContent = data.log || data.error || '(空)';
    if (stick) pre.scrollTop = pre.scrollHeight;
  } catch (err) { /* 忽略轮询错误 */ }
}

// ===== 定制窗口（集成在各项目卡片内，🧰 按钮展开；读写经 SSH 代理直达 NAS 本机接口） =====
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

async function nasApi(port, method, p, body) {
  const res = await fetch('/api/nas/api', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ port, method, path: p, body }),
  });
  return res.json();
}

async function winView(port, p, label) {
  const data = await nasApi(port, 'GET', p);
  openDrawer(`🧰 ${label}`);
  drawerCtx = null; // 窗口查看不走日志轮询
  document.getElementById('drawerLog').textContent = JSON.stringify(data, null, 2);
}

let winFloatFor = null; // 当前悬浮窗对应的项目 id（悬浮窗独立于 grid，4s 刷新不会重建/关闭它）

function toggleWinPanel(id, ev) {
  if (ev) ev.stopPropagation();
  if (winFloatFor === id) return closeWinFloat();
  const proj = ((DATA && DATA.projects) || []).find((x) => x.id === id);
  const card = document.getElementById('card-' + id);
  const float = document.getElementById('winFloat');
  if (!proj || !card || !float) return;
  winFloatFor = id;
  float.innerHTML = `<div class="bar"><b>🧰 ${esc(proj.name)} · 定制窗口</b><span style="flex:1"></span>
    <button onclick="closeWinFloat()">收起 ✕</button></div>
    <div>${renderWinPanel(proj)}</div>`;
  // 浮现在该卡片上方（略小于卡片，随页面滚动）
  const r = card.getBoundingClientRect();
  float.style.left = Math.max(8, r.left + window.scrollX + 10) + 'px';
  float.style.top = (r.top + window.scrollY + 46) + 'px';
  float.style.width = Math.max(320, r.width - 20) + 'px';
  float.style.maxHeight = Math.max(260, r.height - 58) + 'px';
  float.style.display = 'block';
  if (id === 'duty') { loadWhitelistNames(3006, 'duty'); loadDutyGroups(3006); }
}

function closeWinFloat() {
  winFloatFor = null;
  const float = document.getElementById('winFloat');
  if (float) { float.style.display = 'none'; float.innerHTML = ''; }
}

function renderWinPanel(p) {
  const rows = p.windows.map((w) => {
    if (w.kind === 'whitelist') {
      return `<div class="win-row">☰ ${w.d}：<span id="wlNames-${p.id}">加载中…</span></div>
        <div class="win-row">
          <input id="wlAdd-${p.id}" placeholder="加入人名" size="12">
          <input id="wlRemove-${p.id}" placeholder="移除人名" size="12">
          <button class="primary" onclick="whitelistSave('${p.id}')">执行增删</button>
          <button onclick="winView(${p.port}, '/api/duty/whitelist', '白名单原始 JSON')">原始 JSON</button>
        </div>`;
    }
    if (w.kind === 'rules') {
      return `<div class="win-row">✏️ ${w.d}
        <button class="primary" onclick="openRulesEditor('${w.table}')">打开编辑器</button>
        <button onclick="winView(${p.port}, '${w.p}', '${w.d}')">查看</button></div>`;
    }
    if (w.p === '/api/duty/policy') {
      return `<div class="win-row">✏️ ${w.d} <span class="badge method">${w.m}</span>
          <button onclick="winView(${p.port}, '${w.p}', '${w.d}')">查看</button></div>
        <div class="win-row">
          <input id="dutyGroups" placeholder="管辖群 chat_id，逗号分隔（清空保存 = 不限制）" style="flex:1; min-width:260px;">
          <button class="primary" onclick="saveDutyGroups(${p.port})">保存管辖</button>
        </div>
        <div class="win-row" id="dutyGroupsNow"></div>`;
    }
    if (w.kind === 'action') {
      return `<div class="win-row">· ${w.d} <span class="badge method">${w.m}</span>
        <button onclick="rosterRefresh(${p.port}, this)">立即执行</button></div>`;
    }
    return `<div class="win-row">· ${w.d} <span class="badge method">${w.m}</span>
      <button onclick="winView(${p.port}, '${w.p}', '${w.d}')">查看</button>
      ${/policy/.test(w.p) ? '<span class="nas">（env 配置：改 .env 后 push 生效）</span>' : ''}</div>`;
  }).join('');
  // hub：规则编辑器容器（openRulesEditor 往这里渲染；修复此前容器缺失导致按钮无响应的问题）
  return rows + (p.id === 'hub' ? '<div id="rulesEditor"></div>' : '');
}

async function loadWhitelistNames(port, pid) {
  const data = await nasApi(port, 'GET', '/api/duty/whitelist');
  const el = document.getElementById(`wlNames-${pid}`);
  if (el) el.innerHTML = data.names && data.names.length
    ? data.names.map((n) => `<span class="badge">${esc(n)}</span>`).join(' ')
    : '<span class="nas">（空——所有人都在值日队列）</span>';
}

async function whitelistSave(pid) {
  const add = (document.getElementById(`wlAdd-${pid}`).value || '').trim();
  const remove = (document.getElementById(`wlRemove-${pid}`).value || '').trim();
  if (!add && !remove) return toast('先填要加入或移除的人名');
  const body = {};
  if (add) body.add = [add];
  if (remove) body.remove = [remove];
  const data = await nasApi(3006, 'POST', '/api/duty/whitelist', body);
  if (data.names) {
    toast(`白名单已更新：${data.names.length} 人 ✓`);
    document.getElementById(`wlAdd-${pid}`).value = '';
    document.getElementById(`wlRemove-${pid}`).value = '';
    loadWhitelistNames(3006, pid);
  } else {
    toast(data.error || '失败');
  }
}

async function rosterRefresh(port, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '同步中…（约 5 秒）'; }
  try {
    const r = await nasApi(port, 'POST', '/api/duty/roster/refresh');
    if (r.success) {
      toast(`通讯录同步完成：${r.total} 人 ✓`);
      await winView(port, '/api/duty/roster', `名册全景（刚同步：${r.total} 人）`);
      if (winFloatFor === 'duty') loadWhitelistNames(3006, 'duty');
    } else {
      toast((r.error || '失败') + '——瞬时网络抖动会自动重试一次，可稍后再点');
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '立即执行'; }
  }
}

async function loadDutyGroups(port) {
  const data = await nasApi(port, 'GET', '/api/duty/policy');
  const input = document.getElementById('dutyGroups');
  const now = document.getElementById('dutyGroupsNow');
  if (input) input.value = (data.groupChatIds || []).join(',');
  if (now) now.textContent = `当前：${(data.groupChatIds || []).length} 个管辖群${data.overrideActive ? '（在线改写生效中）' : '（env 默认）'}`;
}

async function saveDutyGroups(port) {
  const raw = (document.getElementById('dutyGroups').value || '').split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  const data = await nasApi(port, 'POST', '/api/duty/policy', { groupChatIds: raw });
  if (data.ok) { toast(`管辖策略已保存（${raw.length} 群，即时生效）✓`); loadDutyGroups(port); }
  else toast(data.error || '失败');
}

// —— hub 关键词回答表编辑器 ——
let ruleTableSel = 'group';

async function openRulesEditor(table) {
  ruleTableSel = table || ruleTableSel;
  const el = document.getElementById('rulesEditor');
  if (!el) return toast('编辑器容器未就绪，请收起后重新展开面板');
  el.innerHTML = '加载中…';
  const data = await nasApi(3000, 'GET', `/api/autoreplies/rules?table=${ruleTableSel}`);
  const rules = (data.replies || []).map((r) => {
    const kw = encodeURIComponent(JSON.stringify(r.keywords));
    const answers = r.answers.map((a) => esc(a.text) + (a.weight > 1 ? ` <span class="nas">(w${a.weight})</span>` : '')).join(' ／ ');
    return `<div>· <b>${esc(r.keywords.join('/'))}</b> → ${answers}
      <button onclick="delRule('${ruleTableSel}', this.dataset.kw)" data-kw="${kw}">删</button></div>`;
  }).join('');
  el.innerHTML = `
    <div>当前生效文件：<code>${esc(data.file)}</code> · ${data.enabled ? '<span class="badge ok">已启用</span>' : '<span class="badge err">已停用</span>'}
      <button onclick="toggleRules('${ruleTableSel}', ${!data.enabled})">${data.enabled ? '停用整表' : '启用整表'}</button>
      <button onclick="openRulesEditor('${ruleTableSel === 'group' ? 'mention' : 'group'}')">切到${ruleTableSel === 'group' ? '@触发表' : '群消息表'}</button>
      <span class="nas">改动写 NAS .local.json 即时生效；npm push 会用本地 xlsx 版覆盖</span></div>
    <div class="win-list">${rules || '（空表）'}</div>
    <div class="win-row">
      <input id="ruleKw" placeholder="关键词（逗号分隔同义词）" size="30">
      <button class="primary" onclick="saveRule('${ruleTableSel}')">保存规则（同关键词组覆盖）</button>
    </div>
    <div class="win-row"><textarea id="ruleAns" rows="3" placeholder="每行一条候选回答：回答内容|权重（权重可省，默认 1）"></textarea></div>`;
}

async function saveRule(table) {
  const keywords = (document.getElementById('ruleKw').value || '').split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
  const answersText = document.getElementById('ruleAns').value || '';
  if (!keywords.length || !answersText.trim()) return toast('关键词与回答都不能为空');
  const data = await nasApi(3000, 'POST', '/api/autoreplies/rules', { table, rule: { keywords, answersText } });
  if (data.ok) { toast('规则已保存 ✓（即时生效）'); openRulesEditor(table); }
  else toast(data.error || '失败');
}

async function delRule(table, kwJson) {
  if (!confirm('确认删除这条规则？')) return;
  const keywords = JSON.parse(decodeURIComponent(kwJson));
  const data = await nasApi(3000, 'POST', '/api/autoreplies/rules/delete', { table, keywords });
  if (data.ok) { toast('已删除 ✓'); openRulesEditor(table); }
  else toast(data.error || '失败');
}

async function toggleRules(table, enabled) {
  const data = await nasApi(3000, 'POST', '/api/autoreplies/enabled', { table, enabled });
  if (data.ok) { toast(enabled ? '已启用 ✓' : '已停用 ✓'); openRulesEditor(table); }
  else toast(data.error || '失败');
}

setInterval(() => { refresh(); if (drawerCtx) pullLog(); }, 4000);
refresh();
</script>
</body>
</html>
